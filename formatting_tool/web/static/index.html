      next.setSelectionRange(caret, caret);
    }, 160));
  }

  const save = $("#save");
  if (save) save.addEventListener("click", saveJSON);

  for (const box of document.querySelectorAll("input[data-fix]")) {
    box.addEventListener("change", () => {
      box.checked ? state.ticked.add(box.dataset.fix)
                  : state.ticked.delete(box.dataset.fix);
      // Only the bar's count changes, so redraw it rather than the whole list:
      // a full render would scroll the reader back to the top mid-tick.
      const bar = $(".applybar");
      if (bar) {
        bar.outerHTML = applyBarHTML(state.result.report.issues || []);
        wireApplyBar();
      }
    });
  }
  wireApplyBar();

  const preview = $("#do-preview");
  if (preview) preview.addEventListener("click", () => renderPreview());

  const toQa = $("#to-qa");
  if (toQa) toQa.addEventListener("click", handOverToDesignCheck);

  const changes = document.querySelector("details.changes");
  if (changes) changes.addEventListener("toggle", () => {
    state.changesOpen = changes.open;
  });

  wireClusters(document);

  for (const fold of document.querySelectorAll("details.slide-fold")) {
    fold.addEventListener("toggle", () => {
      state.slideOpen[fold.dataset.slide] = fold.open;
    });
  }

  wirePreview();
}

/* Remember which groups are folded open.
 *
 * `toggle` does not bubble, so this binds each fold rather than delegating,
 * and it is called again wherever a section redraws itself -- the preview does
 * that on its own, and a fold that came back unbound would forget the state
 * the moment it was used. */
function wireClusters(root) {
  for (const cluster of root.querySelectorAll("details.cluster")) {
    cluster.addEventListener("toggle", () => {
      state.clusters[cluster.dataset.cluster] = cluster.open;
    });
  }
}

function wirePreview() {
  // Redraws the preview alone, and re-wires only itself. A full render would
  // scroll the reader back to the top, away from the very slide they were
  // comparing; re-running wireResults would bind a second listener to every
  // chip and checkbox still on the page.
  const hl = $("#hl-toggle");
  if (hl) hl.addEventListener("change", () => {
    state.highlight = hl.checked;
    const section = document.querySelector(".preview");
    if (!section) return;
    section.outerHTML = previewHTML();
    wirePreview();
    wireClusters(document.querySelector(".preview") || document);
  });

  wireClusters(document.querySelector(".preview") || document);

  for (const badge of document.querySelectorAll(".hl b[data-jump]")) {
    badge.addEventListener("click", () => jumpToChange(badge.dataset.jump));
    badge.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        jumpToChange(badge.dataset.jump);
      }
    });
  }
}

/* Open every fold a row sits inside, so an anchor into it lands on something.
 *
 * A row under a slide is now inside two: the slide's own fold and the group of
 * changes it belongs to. An anchor into a closed <details> scrolls nowhere, so
 * both have to be opened, and the state recorded -- otherwise the next redraw
 * closes what the reader has just been shown. */
function openFoldsAround(row) {
  for (let fold = row.closest("details"); fold; fold = fold.parentElement?.closest("details")) {
    if (!fold.open) fold.open = true;
    if (fold.classList.contains("slide-fold")) {
      state.slideOpen[fold.dataset.slide] = true;
    } else if (fold.classList.contains("cluster")) {
      state.clusters[fold.dataset.cluster] = true;
    } else if (fold.classList.contains("changes")) {
      state.changesOpen = true;
    }
  }
}

/* Show the line a box's number stands for.
 *
 * The list is folded by default, so an anchor alone would scroll to something
 * display:none and land nowhere. Opening it first is the whole trick, and the
 * flash is what stops a jump into forty near-identical lines from leaving the
 * reader hunting for which one moved. */
function jumpToChange(key) {
  // The row under the slide first: it is beside the render being compared, so
  // reaching it costs no scrolling away from the picture. Its list may be
  // folded, though -- long ones start that way -- and an anchor into a closed
  // <details> lands nowhere, so it is opened first, exactly as the full list
  // below is.
  let row = document.getElementById(`chgs-${key}`);
  if (row) openFoldsAround(row);
  if (!row) {
    const details = document.querySelector("details.changes");
    if (details && !details.open) {
      details.open = true;
      state.changesOpen = true;
    }
    row = document.getElementById(`chg-${key}`);
    if (row) openFoldsAround(row);
  }
  if (!row) return;
  row.scrollIntoView({ behavior: "smooth", block: "center" });
  row.classList.remove("found");
  // Reading offsetWidth restarts the animation; without it a second click on
  // the same number does nothing visible.
  void row.offsetWidth;
  row.classList.add("found");
}

function wireApplyBar() {
  const all = $("#tick-all");
  if (all) all.addEventListener("click", () => {
    state.ticked = new Set(state.fixable);
    render();
  });
  const none = $("#tick-none");
  if (none) none.addEventListener("click", () => {
    state.ticked.clear();
    render();
  });
  const apply = $("#apply");
  if (apply) apply.addEventListener("click", applyTicked);
}

function debounce(fn, ms) {
  let timer;
  return (...args) => { clearTimeout(timer); timer = setTimeout(() => fn(...args), ms); };
}

function saveJSON() {
  const report = state.result.report;
  const blob = new Blob([JSON.stringify(report, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `${report.decks[0].replace(/\.pptx$/i, "")}-review.json`;
  a.click();
  URL.revokeObjectURL(a.href);
}

/* ---------------- wiring ---------------- */

document.querySelectorAll(".drop").forEach(wireDrop);

$("#layers").addEventListener("click", (e) => {
  const button = e.target.closest("button");
  if (!button) return;
  state.useAI = button.dataset.ai === "1";
  for (const b of $("#layers").children) b.classList.toggle("on", b === button);
});

$("#run").addEventListener("click", runCheck);
document.addEventListener("keydown", (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key === "Enter") runCheck();
});

renderFiles();
boot();
</script>
</body>
</html>
