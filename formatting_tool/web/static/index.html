<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deck check</title>
<link rel="stylesheet" href="/static/tokens.css">
<style>
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 400 14px/1.55 ui-sans-serif, -apple-system, "Segoe UI", Inter, system-ui, sans-serif;
  font-feature-settings: "cv05", "ss01";
}
main { max-width: 880px; margin: 0 auto; padding: 56px 24px 120px; }
h1, h2, h3 { margin: 0; font-weight: 600; letter-spacing: -0.011em; }
code { font-family: var(--mono); font-size: 12px; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

/* ---------- header ---------- */
header { margin-bottom: 34px; }
header h1 { font-size: 19px; }
header p { margin: 5px 0 0; color: var(--muted); font-size: 13px; }
/* The way to the other page. Quiet: it is a second tool, not a second half
   of this one, and a designer who wants it knows it is there. */
header .elsewhere { color: var(--muted); margin-left: 6px; }
header .elsewhere:hover { color: var(--ink); }

/* ---------- drop zones ---------- */
.inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 620px) { .inputs { grid-template-columns: 1fr; } }

.drop {
  position: relative;
  background: var(--surface);
  border: 1px dashed var(--line-strong);
  border-radius: 10px;
  padding: 18px;
  min-height: 116px;
  display: flex; flex-direction: column; gap: 4px;
  transition: border-color .12s ease, background .12s ease;
}
.drop:hover { border-color: var(--faint); }
.drop.over { border-color: var(--accent); border-style: solid; background: var(--tint); }
/* The tall drop target earns its space while empty; once a file is in it the
   grid keeps both columns level anyway. */
.drop.filled { border-style: solid; border-color: var(--line-strong); min-height: 0; }
.drop-label {
  font-size: 11px; letter-spacing: .07em; text-transform: uppercase;
  color: var(--faint); font-weight: 600;
}
.drop-hint { color: var(--muted); font-size: 13px; }
.drop-hint u { text-decoration-color: var(--line-strong); text-underline-offset: 2px; cursor: pointer; }
.files { list-style: none; margin: 6px 0 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.files li { display: flex; align-items: baseline; gap: 8px; font-size: 13px; }
.files .size { color: var(--faint); font-size: 11px; font-family: var(--mono); margin-left: auto; }
.files .x {
  border: 0; background: none; color: var(--faint); padding: 0 2px;
  font-size: 15px; line-height: 1;
}
.files .x:hover { color: var(--blocker); }
.drop input[type=file] { display: none; }

/* ---------- controls ---------- */
.controls {
  display: flex; align-items: flex-end; gap: 18px; flex-wrap: wrap;
  margin-top: 18px;
}
.field { display: flex; flex-direction: column; gap: 6px; }
.field > span {
  font-size: 11px; letter-spacing: .07em; text-transform: uppercase;
  color: var(--faint); font-weight: 600;
}
select, input[type=text], input[type=number] {
  font: inherit; color: inherit; background: var(--surface);
  border: 1px solid var(--line-strong); border-radius: 7px;
  padding: 7px 10px; min-width: 190px;
}
input[type=number] { min-width: 84px; }

.segmented { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 7px; overflow: hidden; }
.segmented button {
  border: 0; background: var(--surface); padding: 7px 13px; font-size: 13px;
  color: var(--muted);
}
.segmented button + button { border-left: 1px solid var(--line-strong); }
.segmented button.on { background: var(--accent); color: var(--accent-ink); font-weight: 500; }

.run {
  margin-left: auto; border: 0; border-radius: 7px;
  background: var(--accent); color: var(--accent-ink);
  padding: 9px 20px; font-weight: 500;
}
.run:disabled { opacity: .45; cursor: default; }

details.advanced { margin-top: 16px; }
details.advanced summary {
  cursor: pointer; color: var(--muted); font-size: 12.5px;
  list-style: none; width: fit-content;
}
details.advanced summary::-webkit-details-marker { display: none; }
details.advanced summary::before { content: "+ "; color: var(--faint); }
details.advanced[open] summary::before { content: "\2212  "; }
.advanced-body {
  display: flex; gap: 16px; flex-wrap: wrap; margin-top: 14px;
  padding: 16px; background: var(--surface);
  border: 1px solid var(--line); border-radius: 9px;
}
.note { font-size: 12px; color: var(--faint); flex-basis: 100%; margin: 0; }

/* ---------- status ---------- */
.status { margin-top: 22px; font-size: 13px; color: var(--muted); }
.status.err { color: var(--blocker); }
.spinner {
  display: inline-block; width: 11px; height: 11px; margin-right: 8px;
  border: 1.5px solid var(--line-strong); border-top-color: var(--accent);
  border-radius: 50%; animation: spin .7s linear infinite; vertical-align: -1px;
}
@keyframes spin { to { transform: rotate(360deg); } }
/* Tabular figures so the line does not jog sideways at 10s and 100s. */
.status .elapsed { font-variant-numeric: tabular-nums; }

/* ---------- summary ---------- */
.summary {
  margin-top: 34px; padding-top: 18px;
  border-top: 1px solid var(--line-strong);
}
.summary-line { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.summary-line .count { font-size: 19px; font-weight: 600; letter-spacing: -0.02em; }
.summary-line .meta { color: var(--muted); font-size: 12.5px; }
.summary-line .meta code { color: var(--muted); }

.toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid var(--line-strong); background: var(--surface);
  border-radius: 20px; padding: 4px 11px; font-size: 12.5px; color: var(--muted);
}
.chip .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.chip.on { color: var(--ink); border-color: var(--faint); }
.chip.off { opacity: .42; }
.chip .n { font-family: var(--mono); font-size: 11px; }
.chip.blocker .dot { color: var(--blocker); }
.chip.error   .dot { color: var(--error); }
.chip.warning .dot { color: var(--warning); }
.chip.info    .dot { color: var(--info); }
.toolbar .grow { margin-left: auto; display: flex; gap: 8px; }
.toolbar input[type=text] { min-width: 160px; padding: 5px 10px; font-size: 13px; border-radius: 20px; }
.linkish {
  border: 1px solid var(--line-strong); background: var(--surface);
  border-radius: 20px; padding: 5px 12px; font-size: 12.5px; color: var(--muted);
}
.linkish:hover { color: var(--ink); border-color: var(--faint); }

/* ---------- notices ---------- */
.notice {
  margin-top: 16px; padding: 11px 14px; border-radius: 8px;
  border: 1px solid var(--line-strong); background: var(--surface);
  font-size: 13px; display: flex; gap: 10px; align-items: flex-start;
}
.notice b { font-weight: 600; }
.notice.warn { border-left: 3px solid var(--warning); }
.notice.bad  { border-left: 3px solid var(--blocker); }
.notice p { margin: 3px 0 0; color: var(--muted); font-size: 12.5px; }

/* ---------- findings ---------- */
.deck-group { margin-top: 30px; }
.deck-group > h2 {
  font-size: 13px; letter-spacing: .04em; text-transform: uppercase;
  color: var(--faint);
  padding-bottom: 8px; border-bottom: 1px solid var(--line);
}
.slide-head {
  margin-top: 22px; margin-bottom: 2px;
  font-size: 12px; font-family: var(--mono); color: var(--faint);
}

.finding {
  display: grid; grid-template-columns: 22px 82px 1fr; gap: 14px;
  padding: 11px 0; border-bottom: 1px solid var(--line);
}
/* The tick column is always there, filled or not, so the severity labels stay
   in one line down the page whether or not a finding can be applied. */
.tick { display: flex; align-items: flex-start; padding-top: 2px; }
.tick input { width: 15px; height: 15px; cursor: pointer; accent-color: var(--ink, #1f2a44); }
.tick.empty { display: block; }
.finding.fixable .msg { text-decoration: none; }

/* ---------- apply ---------- */
.applybar {
  margin: 22px 0 4px; padding: 14px 16px;
  border: 1px solid var(--line); border-radius: 8px; background: var(--card, #fbfbfa);
}
.applybar-line { font-size: 13px; }
.applybar-actions {
  display: flex; align-items: center; gap: 14px; margin-top: 10px; flex-wrap: wrap;
}
.applybar-actions .grow { flex: 1; }
.applybar .reb { font-size: 12px; color: var(--faint); display: flex; align-items: center; gap: 6px; }
.applybar button#apply {
  padding: 7px 16px; border-radius: 6px; border: 1px solid transparent;
  background: #1f2a44; color: #fff; font-size: 13px; cursor: pointer;
}
.applybar button#apply:disabled { opacity: .4; cursor: default; }

.applied { margin: 18px 0; padding: 14px 16px; border: 1px solid var(--line); border-radius: 8px; }
.applied-head { display: flex; align-items: center; gap: 10px; font-size: 13px; flex-wrap: wrap; }
.applied-head .grow { flex: 1; }
.applied-list { margin: 10px 0 0; padding-left: 18px; font-size: 12px; line-height: 1.7; }
.applied-list .dim { color: var(--faint); }
/* Numbered rows carry their own marker, so the list's own one would double it. */
.applied-list .numbered { list-style: none; margin-left: -18px; }
.applied-list .num {
  display: inline-block; min-width: 15px; text-align: center;
  background: var(--hl); color: #fff;
  font: 600 9px/1.6 var(--mono); border-radius: 3px;
  padding: 0 3px; margin-right: 7px; vertical-align: 1px;
}
.applied-list code { color: var(--faint); margin-left: 6px; }
/* Long enough to find the row after the page has scrolled to it. */
@keyframes found { from { background: var(--tint); } to { background: transparent; } }
.applied-list li.found { animation: found 1.6s ease-out; }
.applied a.dl { font-size: 12px; }
/* The take-back. Quiet enough that it is not competing with the change it
   sits beside, close enough that it is obviously about that one line. */
.applied-list .take, .slide-changes .take {
  padding: 1px 9px; font-size: 11.5px; margin-left: 8px; vertical-align: 1px;
}
.undone { margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--line); }
.undone .note { color: var(--faint); font-size: 11.5px; margin: 6px 0 0; }
.undone-list li { color: var(--faint); }
.slide-changes.held { color: var(--faint); font-size: 11.5px; margin: 6px 0 0; }
.slide-fold .clusters { margin: 4px 0 0 4px; }
.slide-fold .cluster > summary { font-size: 12px; color: var(--muted); }
.undo-note { color: var(--blocker); margin-left: 6px; }
/* A note about the change, set apart from it: run into the sentence, "wrap
   only" reads as part of what the fix did. */
.quiet {
  display: inline-block; margin: 0 6px; padding: 0 7px;
  border: 1px solid var(--line); border-radius: 20px;
  font-size: 10.5px; color: var(--faint); white-space: nowrap;
}
/* Clusters: one fold per kind of change, so forty lines read as six groups. */
.clusters { margin-top: 8px; }
.cluster { margin: 4px 0; }
.cluster > summary {
  cursor: pointer; font-size: 12.5px; padding: 3px 0; color: var(--ink);
}
.cluster > summary::marker { color: var(--faint); }
.cluster > .applied-list { margin-top: 4px; }
/* The bar over a pair of renders: which slide, and the way to render it again. */
.slide-bar {
  display: flex; align-items: center; gap: 10px;
  font-size: 12.5px; margin: 14px 0 6px;
}
.undone-list .tag {
  display: inline-block; margin-right: 6px; padding: 1px 7px;
  border: 1px solid var(--line-strong); border-radius: 20px;
  font-size: 10.5px; letter-spacing: 0.04em; text-transform: uppercase;
  color: var(--muted);
}

.preview { margin: 18px 0; }
.shots { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 12px; }
.shot span { display: block; font-size: 11px; font-family: var(--mono); color: var(--faint); margin-bottom: 5px; }
.shot img { width: 100%; border: 1px solid var(--line); border-radius: 4px; display: block; }
@media (max-width: 860px) { .shots { grid-template-columns: 1fr; } }

/* One slide: its two renders and what changed on it, as a single block, so a
   long run does not interleave one slide's list with the next slide's shots. */
.slide-block { margin-top: 20px; padding-bottom: 18px; border-bottom: 1px solid var(--line); }
.slide-block:last-child { border-bottom: 0; padding-bottom: 0; }
/* Folds like the full list below, and looks like it, so the two read as the
   same kind of thing at two scales. */
.slide-fold { margin-top: 9px; font-size: 12px; }
.slide-fold summary {
  cursor: pointer; color: var(--muted); list-style: none; width: fit-content;
}
.slide-fold summary::-webkit-details-marker { display: none; }
.slide-fold summary::before { content: "+ "; color: var(--faint); }
.slide-fold[open] summary::before { content: "\2212  "; }
.slide-fold summary:hover { color: var(--ink); }
/* The count of things the render cannot show, on the summary, so a folded
   list still says that some of what it holds is unmarkable. */
.slide-fold .off-count { color: var(--warning); }
.slide-changes { margin: 10px 0 0; padding: 0; list-style: none; font-size: 12px; }
.slide-changes li {
  display: flex; gap: 7px; align-items: baseline;
  padding: 3px 0; line-height: 1.6;
}
.slide-changes li b { font-weight: 600; white-space: nowrap; }
.slide-changes .num { flex: none; }
.slide-changes li.found { background: var(--tint); border-radius: 3px; }
.slide-changes.empty { color: var(--faint); font-size: 12px; margin: 10px 0 0; }
/* Shares the badge with the full list, and the flash that answers a click. */
/* A change with nothing to point at has to be as visible in the list as the
   ones that do, not quieter than them. Faint grey was the first attempt and
   it read as decoration -- the row a designer most needs to notice, because
   they cannot check it against the render, was the one hardest to see. */
.slide-changes .num.off {
  background: var(--warning); color: var(--surface);
  min-width: 0; padding: 0 5px; letter-spacing: .04em;
}
.slide-changes li.offcanvas b { color: var(--warning); }
.slide-changes .num {
  display: inline-block; min-width: 15px; text-align: center;
  background: var(--hl); color: #fff;
  font: 600 9px/1.6 var(--mono); border-radius: 3px;
  padding: 0 3px; vertical-align: 1px;
}
.slide-changes li.found { animation: found 1.6s ease-out; }

/* ---------- change highlights ---------- */
/* The box is positioned against the image, so the wrapper has to be exactly
   the image's size: inline-block and a block img, no line-box slack. */
/* Clipped, as a guarantee rather than a hope: a box is positioned from
   measured geometry, and a shape half off the slide edge is a real thing to
   mark, so the half that is on the slide is drawn and the rest is cut. */
.frame { position: relative; display: block; overflow: hidden; }
/* The reserved box. `height:auto` would be zero until the image loads, which
   is exactly when the overlay is being positioned against it. */
.frame img { width: 100%; height: auto; display: block; }
.hl {
  position: absolute;
  border: 2px solid var(--hl);
  border-radius: 2px;
  box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.55);
  pointer-events: none;
}
/* Above the border, so it never covers the shape it is pointing at. Small:
   it is an index into the list below, not a caption. */
.hl b {
  position: absolute; left: -2px; bottom: 100%;
  background: var(--hl); color: #fff;
  font: 600 7.5px/1.35 var(--mono);
  min-width: 11px; text-align: center;
  padding: 0 2px; border-radius: 2px 2px 0 0;
  white-space: nowrap;
  pointer-events: auto; cursor: pointer;
}
.hl b:hover { filter: brightness(1.15); }
/* Except on a shape at the very top of the slide, where there is no room
   above and the label would sit over the caption instead. */
.hl.high b { bottom: auto; top: 0; border-radius: 0 0 2px 0; }
.hl.gone { border-style: dashed; }
.shot.stale .hl { display: none; }
.hl-legend { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.hl-legend .swatch {
  width: 22px; height: 0; border-top: 2px solid var(--hl); display: inline-block;
}
.finding .sev {
  display: flex; align-items: center; gap: 6px;
  /* Grid items stretch by default, which would centre the label against the
     whole finding. It belongs beside the first line of the message. */
  align-self: start; padding-top: 3px;
  font-size: 11.5px; letter-spacing: .02em;
}
.finding .sev .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none; }
.finding.blocker .sev { color: var(--blocker); }
.finding.error   .sev { color: var(--error); }
.finding.warning .sev { color: var(--warning); }
.finding.info    .sev { color: var(--info); }

.finding .head { display: flex; align-items: baseline; gap: 12px; }
.finding .msg { flex: 1; }
.finding .tag {
  font-family: var(--mono); font-size: 11px; color: var(--faint);
  white-space: nowrap;
}
.finding .where { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
.finding .pair { margin-top: 5px; font-size: 12px; display: flex; gap: 14px; flex-wrap: wrap; }
.finding .pair .k { color: var(--faint); margin-right: 5px; }
.finding .pair code {
  background: var(--tint); border-radius: 4px; padding: 1px 5px;
}
.finding .fix { margin-top: 5px; font-size: 12.5px; color: var(--muted); }
.finding .fix::before { content: "\2192  "; color: var(--faint); }
.badge-ai {
  font-size: 10px; letter-spacing: .06em; text-transform: uppercase;
  border: 1px solid var(--line-strong); border-radius: 4px;
  padding: 0 4px; color: var(--faint);
}

.empty { margin-top: 34px; padding-top: 18px; border-top: 1px solid var(--line-strong); color: var(--muted); }
.hidden { display: none !important; }

.runlog {
  margin-top: 26px; font-size: 12px;
}
.runlog summary { cursor: pointer; color: var(--faint); list-style: none; width: fit-content; }
.runlog summary::-webkit-details-marker { display: none; }
/* Folded by default, so it needs to look like something that opens. */
.changes { margin-top: 10px; }
.changes summary::before { content: "+ "; }
.changes[open] summary::before { content: "\2212  "; }
.changes summary:hover { color: var(--muted); }
.aidebug .batch { margin-top: 12px; }
.aidebug .batch-head {
  font-size: 11px; font-family: var(--mono); color: var(--faint); margin-bottom: 5px;
}
.aidebug pre { max-height: 380px; overflow: auto; }
.runlog pre {
  font-family: var(--mono); font-size: 11.5px; line-height: 1.6;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 8px; padding: 12px 14px; margin: 10px 0 0;
  overflow-x: auto; white-space: pre-wrap; color: var(--muted);
}
/* Running: the controls stop taking presses and look like it. See `setBusy`. */
body.busy { cursor: progress; }
body.busy button, body.busy select, body.busy input, body.busy .dl,
body.busy .drop, body.busy .linkish {
  pointer-events: none; opacity: .5;
}
body.busy #status, body.busy #status * { pointer-events: auto; opacity: 1; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Deck check</h1>
    <p>Validate a deck against its master and brand guidelines.
       <a class="elsewhere" href="/qa">Design check &rarr;</a></p>
  </header>

  <section class="inputs">
    <div class="drop" id="drop-master" data-kind="master">
      <span class="drop-label">Master</span>
      <span class="drop-hint">Drop the approved deck, or <u>browse</u></span>
      <ul class="files"></ul>
      <input type="file" accept=".pptx">
    </div>
    <div class="drop" id="drop-deck" data-kind="deck">
      <span class="drop-label">Decks to check</span>
      <span class="drop-hint">Drop one or more, or <u>browse</u></span>
      <ul class="files"></ul>
      <input type="file" accept=".pptx" multiple>
    </div>
  </section>

  <div class="controls">
    <label class="field">
      <span>Guidelines</span>
      <select id="guidelines"></select>
    </label>
    <div class="field">
      <span>Layers</span>
      <div class="segmented" id="layers">
        <button data-ai="0" class="on">Rules only</button>
        <button data-ai="1">Rules + AI</button>
      </div>
    </div>
    <button class="run" id="run">Run check</button>
  </div>

  <details class="advanced">
    <summary>AI options</summary>
    <div class="advanced-body">
      <label class="field">
        <span>Model</span>
        <input type="text" id="model" spellcheck="false">
      </label>
      <label class="field">
        <span>Effort</span>
        <select id="effort">
          <option>low</option><option>medium</option><option>high</option>
          <option>xhigh</option><option>max</option>
        </select>
      </label>
      <label class="field">
        <span>Min confidence</span>
        <input type="number" id="confidence" min="0" max="1" step="0.05" value="0">
      </label>
      <label class="field">
        <span>Slides per call</span>
        <input type="number" id="batch" min="1" max="50" step="1">
      </label>
      <p class="note" id="ai-note"></p>
    </div>
  </details>

  <div class="status" id="status"></div>
  <div id="results"></div>
</main>

<script>
"use strict";

const SEVERITIES = ["blocker", "error", "warning", "info"];

const state = {
  ctx: null,
  master: null,
  decks: [],
  useAI: false,
  result: null,
  hidden: new Set(),   // severities toggled off
  query: "",
  session: null,
  fixable: new Set(),  // ids the tool can correct on its own
  ticked: new Set(),   // ids the designer has chosen
  applied: null,       // the last apply result
  preview: null,       // before/after renders
  busy: false,
  // The list of what was applied is long on a real deck and is the evidence
  // for a decision already taken, so it starts folded away; the renders are
  // what a designer actually reads. Held here rather than left to <details>
  // because every tick re-renders the section and would fold it back.
  changesOpen: false,
  // Per-slide fold state, by slide number, for the lists under each pair of
  // renders. Only holds slides the reader has actually toggled; the rest fall
  // back to the length rule in `slideListOpen`.
  slideOpen: {},
  highlight: true,     // draw the boxes over the before/after renders
  // Slides to keep in the preview even though nothing on them changed any
  // more. A slide whose only change has been undone would otherwise drop out
  // of the renders at the exact moment the designer is looking at it to check
  // the undo landed, so the slides an undo touched are held here and asked for
  // by name on every later render.
  heldSlides: [],
  // What each undone change actually DID, kept from the run that made it.
  // The server cannot say: on the run that holds a change back, the change was
  // never made, so there is no outcome to describe. The page had it a moment
  // ago, which is the only place it exists.
  undoneDetails: {},
  // Which clusters of changes are folded open, by key. Absent means the
  // length rule in `clusterOpen` decides.
  clusters: {},
};

const $ = (sel) => document.querySelector(sel);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const kb = (n) => n < 1e6 ? `${Math.round(n / 1024)} KB` : `${(n / 1e6).toFixed(1)} MB`;

/* ---------------- boot ---------------- */

async function boot() {
  try {
    state.ctx = await (await fetch("/api/context")).json();
  } catch (err) {
    return setStatus(`Could not reach the server: ${err.message}`, "err");
  }
  const ctx = state.ctx;

  const select = $("#guidelines");
  select.innerHTML =
    `<option value="">None (master only)</option>` +
    ctx.guidelines.map((f) => `<option value="${esc(f)}">${esc(f)}</option>`).join("");
  // A guidelines file is the difference between 11 findings and 21, so pick
  // one if there is exactly one obvious candidate.
  if (ctx.guidelines.length === 1) select.value = ctx.guidelines[0];

  $("#model").value = ctx.defaults.model;
  $("#effort").value = ctx.defaults.effort;
  $("#batch").value = ctx.defaults.batch_size;

  const notes = [];
  if (ctx.defaults.cli_model !== ctx.defaults.model) {
    notes.push(`The CLI default is <code>${esc(ctx.defaults.cli_model)}</code>, which is retired and answers 404.`);
  }
  if (!ctx.api_key) notes.push("No <code>ANTHROPIC_API_KEY</code> in the environment, so the AI layer will fail.");
  $("#ai-note").innerHTML = notes.join(" ");

}

/* ---------------- file inputs ---------------- */

function wireDrop(el) {
  const kind = el.dataset.kind;
  const input = el.querySelector("input[type=file]");

  el.addEventListener("click", (e) => {
    // The remove buttons live inside the zone, and this listener runs before
    // the document-level one that handles them.
    if (e.target === input || e.target.closest(".x")) return;
    input.click();
  });
  input.addEventListener("change", () => { accept(kind, input.files); input.value = ""; });

  el.addEventListener("dragover", (e) => { e.preventDefault(); el.classList.add("over"); });
  el.addEventListener("dragleave", (e) => {
    if (!el.contains(e.relatedTarget)) el.classList.remove("over");
  });
  el.addEventListener("drop", (e) => {
    e.preventDefault();
    el.classList.remove("over");
    accept(kind, e.dataTransfer.files);
  });
}

function accept(kind, fileList) {
  const files = [...fileList].filter((f) => f.name.toLowerCase().endsWith(".pptx"));
  const rejected = fileList.length - files.length;
  if (rejected) setStatus(`Ignored ${rejected} file(s): only .pptx can be read.`, "err");
  if (!files.length) return;

  if (kind === "master") state.master = files[0];
  else state.decks = dedupe([...state.decks, ...files]);
  renderFiles();
}

const dedupe = (files) => {
  const seen = new Set();
  return files.filter((f) => {
    const key = `${f.name}:${f.size}`;
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  });
};

function renderFiles() {
  paint($("#drop-master"), state.master ? [state.master] : [], "master");
  paint($("#drop-deck"), state.decks, "deck");
  $("#run").disabled = !(state.master && state.decks.length);
}

function paint(el, files, kind) {
  el.classList.toggle("filled", files.length > 0);
  el.querySelector(".drop-hint").classList.toggle("hidden", files.length > 0);
  el.querySelector(".files").innerHTML = files.map((f, i) => `
    <li>
      <span>${esc(f.name)}</span>
      <span class="size">${kb(f.size)}</span>
      <button class="x" data-kind="${kind}" data-i="${i}" title="Remove">&times;</button>
    </li>`).join("");
}

document.addEventListener("click", (e) => {
  const x = e.target.closest(".x");
  if (!x) return;
  e.stopPropagation();
  if (x.dataset.kind === "master") state.master = null;
  else state.decks.splice(Number(x.dataset.i), 1);
  renderFiles();
});

/* ---------------- run ---------------- */

/* Hand the restyled deck to the design check.
 *
 * THE ORDER IS THIS PIPELINE'S OWN ARGUMENT, one stage further on. Applying
 * the master goes first because putting content into its placeholders settles
 * a great many findings and raises a few, so a report written before it
 * describes a deck nobody will send. The design check reads a PICTURE, and a
 * picture of a deck that has not been restyled yet is a picture of a deck that
 * is about to change.
 *
 * IT RUNS SERVER-SIDE AND THE BROWSER FOLLOWS A LINK. The alternative is
 * downloading the corrected deck and uploading it to the other page, which is
 * the same two files and a round trip through somebody's Downloads folder. So
 * the check runs against the copy the server already has and the page opens on
 * its id. Nothing goes up the wire twice.
 *
 * Slow on purpose to be honest about: this is a render of every slide and a
 * model call for each one, the same as the design check always is. The button
 * says so while it waits rather than looking broken.
 */
async function handOverToDesignCheck() {
  if (state.busy || !state.session) return;
  const stopTicking = startTicking(
    "Rendering the corrected deck and running the design check");
  state.busy = true;
  try {
    const response = await fetch("/api/qa/handoff", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        session: state.session,
        options: { model: $("#model")?.value, effort: $("#effort")?.value },
      }),
    });
    const data = await response.json();
    if (!response.ok) throw new Error(data.detail || data.error || `HTTP ${response.status}`);
    // The id, not the report: the design page reads it back from the session,
    // so a reload there costs nothing and this page does not have to carry a
    // report it has no way to show.
    location.href = `/qa#session=${encodeURIComponent(data.session)}`;
  } catch (err) {
    setStatus(`<b>The design check could not be started.</b> ${esc(err.message)}`, "err");
  } finally {
    stopTicking();
    state.busy = false;
  }
}

function setStatus(html, cls = "") {
  const el = $("#status");
  el.className = `status ${cls}`;
  el.innerHTML = html;
}

/* A status line that counts up without restarting its own spinner.
 *
 * setStatus assigns innerHTML, which throws the spinner element away and
 * builds a new one, and a new element starts its animation at zero. Called
 * from a 200ms tick against a 0.7s rotation, the spinner got 103 degrees
 * round -- just past a quarter turn -- and snapped back to the top, forever.
 * It was never the animation: it was a new spinner, four times a second.
 *
 * So the line is written once and only the seconds are rewritten, through
 * textContent on a node the spinner is not inside. Returns the function that
 * stops it.
 */
/* WHILE SOMETHING IS RUNNING, THE PAGE SAYS SO AND STOPS TAKING ORDERS.
 *
 * Every long call already refused to start a second time -- `state.busy` is
 * checked at the top of each one -- so a second press was always harmless.
 * That is exactly the problem: it was harmless and INVISIBLE. A designer
 * presses Apply, nothing appears to happen for the eleven seconds PowerPoint
 * takes, and presses it again, which also appears to do nothing. The guard
 * that made the tool safe made it look broken.
 *
 * So the refusal moves into the page: a class on <body> greys the controls and
 * turns the cursor to `progress`, which is a press that visibly does not land
 * rather than one that silently does not. The status line keeps its spinner
 * and its running count beside it.
 *
 * Counted rather than a boolean. A re-render started while a round is still
 * finishing would otherwise clear the flag on whichever returned first and
 * hand a half-busy page back.
 */
let _running = 0;

function setBusy(on) {
  _running = Math.max(0, _running + (on ? 1 : -1));
  document.body.classList.toggle("busy", _running > 0);
}

function startTicking(label) {
  const started = Date.now();
  setBusy(true);
  setStatus(`<span class="spinner"></span>${label}&hellip; ` +
            `<span class="elapsed">0s</span>`);
  const tick = setInterval(() => {
    const elapsed = $("#status .elapsed");
    // Gone means something else has claimed the status line -- an error, or
    // the run finishing -- and there is nothing left to count into.
    if (!elapsed) return;
    elapsed.textContent = `${((Date.now() - started) / 1000).toFixed(0)}s`;
  }, 200);
  return () => { clearInterval(tick); setBusy(false); };
}

async function runCheck() {
  if (!state.master || !state.decks.length) return;

  const form = new FormData();
  form.append("master", state.master, state.master.name);
  for (const deck of state.decks) form.append("deck", deck, deck.name);
  form.append("options", JSON.stringify({
    guidelines: $("#guidelines").value,
    use_ai: state.useAI,
    // Always on from the page. Half of what the AI layer is asked to do can
    // only be read off a picture -- text clipped by its box, a shape hidden
    // behind another, whether a slide's off-palette colours are carrying
    // meaning -- and this was never sent, so every review from here ran on
    // geometry alone and those checks were quietly inert.
    render: true,
    model: $("#model").value,
    effort: $("#effort").value,
    min_confidence: Number($("#confidence").value) || 0,
    batch_size: Number($("#batch").value) || undefined,
  }));

  $("#run").disabled = true;
  $("#results").innerHTML = "";
  state.ticked.clear();
  state.applied = null;
  state.preview = null;

  const stopTicking = startTicking(
    `Reading ${state.decks.length} deck(s)` +
    `${state.useAI ? " and asking the model" : ""}`
  );

  try {
    const response = await fetch("/api/validate", { method: "POST", body: form });
    const data = await response.json();
    if (!response.ok) throw new Error(data.detail || data.error || `HTTP ${response.status}`);
    state.result = data;
    state.hidden.clear();
    state.query = "";
    setStatus("");
    render();
  } catch (err) {
    setStatus(`<b>Run failed.</b> ${esc(err.message)}`, "err");
  } finally {
    stopTicking();
    $("#run").disabled = false;
  }
}

/* ---------------- render ---------------- */

function render() {
  const { report, logs, elapsed_s: elapsed, ai } = state.result;
  state.session = state.result.session || state.session;
  if (state.result.fixable) state.fixable = new Set(state.result.fixable);
  const issues = report.issues || [];
  const counts = Object.fromEntries(SEVERITIES.map((s) =>
    [s, issues.filter((i) => i.severity === s).length]));

  const visible = issues.filter((i) => !state.hidden.has(i.severity) && matches(i));

  $("#results").innerHTML = [
    summaryHTML(report, issues, counts, visible, elapsed),
    noticesHTML(logs, ai, report),
    applyBarHTML(issues),
    appliedHTML(),
    previewHTML(),
    visible.length ? groupsHTML(visible) : emptyHTML(issues.length),
    aiDebugHTML(report),
    logHTML(logs),
  ].join("");

  wireResults();
}

const matches = (issue) => {
  if (!state.query) return true;
  const q = state.query.toLowerCase();
  return [issue.message, issue.rule_id, issue.shape, issue.found, issue.expected, issue.suggestion]
    .some((v) => v && String(v).toLowerCase().includes(q));
};

function summaryHTML(report, issues, counts, visible, elapsed) {
  const filtered = visible.length !== issues.length;
  const meta = [
    `${esc(report.decks.join(", "))} vs ${esc(report.master)}`,
    report.guidelines ? esc(report.guidelines.split(/[\\/]/).pop()) : "no guidelines",
    `${elapsed}s`,
  ];
  return `
  <section class="summary">
    <div class="summary-line">
      <span class="count">${issues.length}</span>
      <span>finding${issues.length === 1 ? "" : "s"}</span>
      ${filtered ? `<span class="meta">(${visible.length} shown)</span>` : ""}
      <span class="meta">&middot; ${meta.join(" &middot; ")}</span>
    </div>
    <div class="toolbar">
      ${SEVERITIES.filter((s) => counts[s]).map((s) => `
        <button class="chip ${s} ${state.hidden.has(s) ? "off" : "on"}" data-sev="${s}">
          <span class="dot"></span>${s}<span class="n">${counts[s]}</span>
        </button>`).join("")}
      <div class="grow">
        <input type="text" id="q" placeholder="Filter…" value="${esc(state.query)}">
        <button class="linkish" id="save">Save JSON</button>
      </div>
    </div>
  </section>`;
}

function noticesHTML(logs, ai, report) {
  const out = [];

  if (ai.requested && !ai.ran) {
    const why = logs.find((l) => l.level === "error");
    out.push(`<div class="notice bad">
      <div><b>The AI layer did not run.</b>
      <p>${esc(why ? why.message : "The call failed.")}</p>
      <p>What follows is the deterministic layer alone.</p></div></div>`);
  }

  for (const l of logs.filter((l) => l.level === "warning")) {
    out.push(`<div class="notice warn"><div><b>Warning.</b><p>${esc(l.message)}</p></div></div>`);
  }

  if (report.inferred_values && report.inferred_values.length) {
    out.push(`<div class="notice warn"><div>
      <b>${report.inferred_values.length} brand value(s) were inferred, not stated.</b>
      <p>Findings resting on these are the weaker claims here:
      <code>${report.inferred_values.map(esc).join("</code>, <code>")}</code></p></div></div>`);
  }

  if (report.ai_summary) {
    out.push(`<div class="notice"><div><b>Model summary.</b><p>${esc(report.ai_summary)}</p></div></div>`);
  }
  return out.join("");
}

function groupsHTML(issues) {
  const byDeck = new Map();
  for (const issue of issues) {
    const key = issue.deck || "deck";
    if (!byDeck.has(key)) byDeck.set(key, []);
    byDeck.get(key).push(issue);
  }

  return [...byDeck].map(([deck, list]) => {
    const bySlide = new Map();
    for (const issue of list) {
      // Deck-level findings carry no slide number; -1 sorts them to the front.
      const slide = issue.slide ?? -1;
      if (!bySlide.has(slide)) bySlide.set(slide, []);
      bySlide.get(slide).push(issue);
    }
    const slides = [...bySlide].sort((a, b) => a[0] - b[0]);

    return `<section class="deck-group">
      <h2>${esc(deck)}</h2>
      ${slides.map(([slide, items]) => `
        <div class="slide-head">${slide < 0 ? "Whole deck" : `Slide ${slide}`}</div>
        ${items.map(findingHTML).join("")}`).join("")}
    </section>`;
  }).join("");
}

function findingHTML(issue) {
  const pairs = [];
  if (issue.expected) pairs.push(`<span><span class="k">expected</span><code>${esc(issue.expected)}</code></span>`);
  if (issue.found) pairs.push(`<span><span class="k">found</span><code>${esc(issue.found)}</code></span>`);

  const tags = [];
  if (issue.source === "ai") {
    tags.push(`<span class="badge-ai">AI${issue.confidence != null
      ? ` ${Math.round(issue.confidence * 100)}%` : ""}</span>`);
  }
  if (issue.rule_id) tags.push(esc(issue.rule_id));
  else tags.push(esc(issue.category));

  const canFix = state.fixable.has(issue.id);
  const box = canFix
    ? `<label class="tick" title="Apply this fix">
         <input type="checkbox" data-fix="${esc(issue.id)}"
                ${state.ticked.has(issue.id) ? "checked" : ""}></label>`
    : `<span class="tick empty" title="Needs a designer">&nbsp;</span>`;

  return `<article class="finding ${esc(issue.severity)}${canFix ? " fixable" : ""}">
    ${box}
    <div class="sev"><span class="dot"></span>${esc(issue.severity)}</div>
    <div>
      <div class="head">
        <span class="msg">${esc(issue.message)}</span>
        <span class="tag">${tags.join(" ")}</span>
      </div>
      ${issue.shape ? `<div class="where">${esc(issue.shape)}</div>` : ""}
      ${pairs.length ? `<div class="pair">${pairs.join("")}</div>` : ""}
      ${issue.suggestion ? `<div class="fix">${esc(issue.suggestion)}</div>` : ""}
    </div>
  </article>`;
}

/* ---------------- apply ---------------- */

function applyBarHTML(issues) {
  const total = state.fixable.size;
  if (!total) {
    return `<div class="notice"><div><b>Nothing here can be applied automatically.</b>
      <p>Every finding needs a designer: which of two overlapping boxes moves,
      which logo file to use, what copy to write. Those are design calls.</p></div></div>`;
  }
  const n = state.ticked.size;
  return `<section class="applybar">
    <div class="applybar-line">
      <b>${n}</b> of ${total} fixable finding${total === 1 ? "" : "s"} ticked
      <span class="meta">&middot; ${issues.length - total} need a designer</span>
    </div>
    <div class="applybar-actions">
      <button class="linkish" id="tick-all">Tick all fixable</button>
      <button class="linkish" id="tick-none">Clear</button>
      <span class="grow"></span>
      <label class="reb"><input type="checkbox" id="rebuild">
        Also rebuild onto the master's layouts</label>
      <button id="apply" ${n ? "" : "disabled"}>Apply ${n || ""}</button>
    </div>
  </section>`;
}

/* What a rule is about, for grouping a long list of changes.
 *
 * Read off the rule id's first segment, which is the only classification the
 * findings already agree on -- `space.alignment_grid`, `color.text.off_palette`
 * -- so nothing here has to be kept in step with the rule list by hand. A rule
 * in a family nobody has named yet lands in "Other" rather than being dropped.
 *
 * The order is the report's own: structure, then brand, then polish. A
 * designer scanning forty changes is looking for a kind of change, and the
 * kinds arrive in the order the report argues them. */
const CLUSTERS = [
  ["layout", "Layout"],
  ["title", "Titles"],
  ["subtitle", "Titles"],
  ["logo", "Logo"],
  ["font", "Typefaces"],
  ["color", "Colour"],
  ["space", "Position and spacing"],
  ["table", "Tables"],
  ["typography", "Typography"],
  ["production_note", "Production notes"],
];

/* The changes a designer will look for on a render and not find.
 *
 * WHY THIS IS A LIST OF RULES and not a measurement. The first version asked
 * whether the shape had moved, on the grounds that a fix which reported the
 * same box twice had changed nothing visible. That is wrong twice over, and
 * both were on the page within a minute: clearing a hardcoded typeface does
 * not move a shape and changes every glyph in it, and re-spacing the cells of
 * a component moves the OTHER shapes, not the one the finding names. Marking
 * either "text only" tells a designer to stop looking at the very changes that
 * are most worth looking at.
 *
 * Only two fixes here, and they are the two that edit characters rather than
 * appearance. Everything else this tool applies shows.
 */
const INVISIBLE = {
  "typography.whitespace": [
    "no visible change",
    "Trailing or repeated spaces were removed. Nothing on the slide moves; "
    + "the copy is the same to read.",
  ],
  "typography.orphan_widow": [
    "wrap only",
    "One non-breaking space, binding two words. It shows on a render only if "
    + "it changes where the line breaks -- in a box too narrow for the pair to "
    + "share a line, it shows nowhere at all.",
  ],
};

function invisibleMark(row) {
  const entry = INVISIBLE[(row && row.rule_id) || ""];
  if (!entry) return "";
  return `<span class="quiet" title="${esc(entry[1])}">${esc(entry[0])}</span>`;
}

function clusterOf(ruleId) {
  const family = String(ruleId || "").split(".")[0];
  const found = CLUSTERS.find(([key]) => key === family);
  return found ? found[1] : "Other";
}

/* Folded shut until somebody opens it, and never against their choice: once a
 * designer has opened a group it stays open, and once they have closed one it
 * stays closed.
 *
 * Closed is the default in both places these appear. Forty-four changes on two
 * slides is a wall of text whichever way it is sorted, and the point of the
 * groups is to be read as six lines that say what kind of work was done --
 * "Colour, 28 changes" -- with the detail there for whoever wants it. A list
 * under a slide has a second reason: it sits between one pair of renders and
 * the next, so anything opened there pushes the next slide off the screen.
 */
function clusterOpen(key, count, fallback) {
  if (key in state.clusters) return state.clusters[key];
  return fallback === undefined ? false : fallback;
}

function clusterHTML(label, rows, render, options = {}) {
  // Keyed separately per slide, or every slide's "Colour" would fold and
  // unfold together -- and the one a designer opened would not be the one that
  // opened.
  const key = options.key || label;
  const open = clusterOpen(key, rows.length, options.open);
  return `<details class="cluster" data-cluster="${esc(key)}"
    ${open ? "open" : ""}>
    <summary>${esc(label)} <span class="meta">&middot; ${rows.length}
      change${rows.length === 1 ? "" : "s"}</span></summary>
    <ul class="applied-list">${rows.map(render).join("")}</ul>
  </details>`;
}

/* The changes of one list, split into the groups they belong to, in report
 * order. Shared so the list under a slide groups exactly as the full list
 * does: two answers to "what kind of change is this" would be one too many. */
function clustered(rows, render, options = {}) {
  const groups = new Map();
  for (const row of rows) {
    const label = clusterOf(row.rule_id);
    if (!groups.has(label)) groups.set(label, []);
    groups.get(label).push(row);
  }
  const order = [...new Set([...CLUSTERS.map(([, label]) => label), "Other"])];
  return order
    .filter((label) => groups.has(label))
    .map((label) => clusterHTML(label, groups.get(label), render, {
      ...options,
      key: options.prefix ? `${options.prefix}:${label}` : label,
    }))
    .join("");
}

function appliedHTML() {
  const r = state.applied;
  if (!r) return "";
  // The same numbering the boxes on the renders carry, so a box and its line
  // are one thing addressed two ways. Numbered rows get an id to jump to.
  const row = (a) => `<li
    ${a.n === null ? "" : `id="chg-${markKey(a)}"`} class="numbered">
    <span class="num">${a.n}</span>
    ${a.slide ? `slide ${a.slide}` : "deck"}${a.shape ? ` &middot; ${esc(a.shape)}` : ""}
    &mdash; ${esc(a.detail)}${a.round === 2
      ? ` <span class="meta">(second pass)</span>` : ""}
    ${invisibleMark(a)}
    <code>${esc(a.id)}</code>${undoButton(a.id)}</li>`;
  // Not numbered: nothing was changed, so there is nothing on a render to
  // point at.
  const skippedRow = (a) => `<li class="dim"><code>${esc(a.id)}</code>
    ${esc(a.detail)}</li>`;

  const clusters = clustered(changeRows(), row);
  const skipped = r.skipped.length
    ? clusterHTML("Skipped, needs a designer", r.skipped, skippedRow)
    : "";

  const n = changeRows().length + r.skipped.length;
  return `<section class="applied">
    <div class="applied-head">
      <b>${r.applied.length} fix${r.applied.length === 1 ? "" : "es"} applied</b>
      ${r.skipped.length ? `<span class="meta">&middot; ${r.skipped.length} skipped</span>` : ""}
      ${r.rebuilt ? `<span class="meta">&middot; rebuilt onto the master</span>` : ""}
      ${(r.undone || []).length ? `<span class="meta">&middot;
        ${r.undone.length} undone</span>` : ""}
      <span class="grow"></span>
      <button class="linkish" id="do-preview">Render before / after</button>
      <button class="linkish" id="to-qa">Run the design check on this</button>
      <a class="dl" href="${esc(r.download)}" download>Download the corrected deck</a>
    </div>
    <details class="runlog changes" ${state.changesOpen ? "open" : ""}>
      <summary>${n} change${n === 1 ? "" : "s"} in detail</summary>
      <div class="clusters">${clusters}${skipped}</div>
    </details>
    ${finishingHTML()}
    ${undoneHTML()}
  </section>`;
}

/* The two passes that run after every fix, and have no tick box behind them.
 *
 * They are not in the change list because nothing in the list can hold them:
 * a gradient stop and a chart series have no finding, no id and no undo, and
 * numbering them against a render would point at a shape nobody reported. But
 * they change what the deck LOOKS like, and a designer handed a deck whose
 * gradients have moved has to be told so by something other than the picture.
 *
 * Silent when neither did anything, which is the ordinary case on a deck that
 * was already on the palette. */
function finishingHTML() {
  const r = state.applied;
  if (!r) return "";
  const lines = [r.palette_sweep, r.contrast_pass].filter(Boolean);
  const open = (r.contrast_unresolved || []);
  if (!lines.length && !open.length) return "";
  return `<div class="finishing">
    ${lines.map((line) => `<p class="meta">${esc(line)}</p>`).join("")}
    ${open.length ? `<details class="runlog">
      <summary>${open.length} pairing${open.length === 1 ? "" : "s"}
        a designer has to settle</summary>
      <ul>${open.map((line) => `<li>${esc(line)}</li>`).join("")}</ul>
    </details>` : ""}
  </div>`;
}

/* What has been taken back, and the way back to it.
 *
 * Listed rather than simply gone, for the reason the skipped fixes are: a
 * change that vanishes from the page without trace reads as a change that was
 * never offered. This says it was made, taken back, and can be had again.
 *
 * The wording is deliberate about what an undo does to the FILE. The deck is
 * written again from the upload without these, so the download is not the
 * corrected file with one shape dragged back; it is the file the run would
 * have produced if the change had never been ticked, and everything else on
 * it is untouched. */
/* The Undo beside one change, or nothing when the change has no id.
 *
 * A change with no id cannot be addressed, and a button that cannot be
 * addressed does nothing when it is pressed -- which is indistinguishable, to
 * whoever pressed it, from a broken feature. Better to not offer it. */
function undoButton(id) {
  if (!id) return "";
  return `<button class="linkish take" data-undo="${esc(id)}">Undo</button>`;
}

function undoneHTML() {
  const held = (state.applied && state.applied.undone) || [];
  if (!held.length) return "";
  return `<div class="undone">
    <b>${held.length} change${held.length === 1 ? "" : "s"} held back</b>
    <ul class="applied-list undone-list">
      ${held.map((u) => {
        const was = state.undoneDetails[u.id];
        // What the change DID, in the words it was described in when it was
        // made. The finding's message -- "this image starts at the 0.92in
        // column" -- says what was wrong; a designer taking a change back is
        // asking what was done about it, and those are different sentences.
        const what = was && was.detail
          ? esc(was.detail)
          : (u.message ? esc(u.message) : "this change");
        const where = (was && was.slide) || u.slide;
        const shape = (was && was.shape) || u.shape;
        return `<li>
          <span class="tag">Undone</span>
          ${where ? `slide ${where}` : "deck"}${shape
            ? ` &middot; ${esc(shape)}` : ""} &mdash; ${what}
          ${was && was.round === 2
            ? `<span class="meta">(second pass)</span>` : ""}
          ${invisibleMark(was)}
          ${u.unknown ? `<span class="meta">(no finding with this id in the
            current report)</span>` : ""}
          <code>${esc(u.id)}</code>
          <button class="linkish take" data-redo="${esc(u.id)}">Restore</button>
        </li>`;
      }).join("")}
    </ul>
    <p class="note">The deck was written again from your upload without these,
      so every other fix is exactly as it was.</p>
  </div>`;
}

function previewHTML() {
  const p = state.preview;
  if (!p) return "";
  if (!p.renderer_ok) {
    return `<div class="notice warn"><div><b>No preview.</b>
      <p>Rendering needs PowerPoint and pywin32 on Windows
      (<code>pip install pywin32</code>).</p></div></div>`;
  }
  const marks = changeMarks();
  const rebuilt = !!(state.applied && state.applied.rebuilt);
  const total = [...marks.values()].reduce((n, m) => n + m.length, 0);
  return `<section class="preview">
    <div class="applied-head"><b>Before and after</b>
      <span class="meta">&middot; rendered by PowerPoint</span>
      <span class="grow"></span>
      ${total ? `<label class="hl-legend"><input type="checkbox" id="hl-toggle"
        ${state.highlight ? "checked" : ""}> <span class="swatch"></span>
        Highlight the ${total} change${total === 1 ? "" : "s"}</label>` : ""}
    </div>
    ${rebuilt && total ? `<p class="note">The deck was also rebuilt onto the
      master, which re-places every shape on the slide. The boxes mark what
      this run corrected; on the after render they show where each shape stood
      before the rebuild moved it.</p>` : ""}
    ${p.slides.map((s) => {
      const mine = marks.get(s.slide) || [];
      return `
      <div class="slide-block">
        <div class="slide-bar">
          <b>Slide ${s.slide}</b>
          <span class="grow"></span>
          <button class="linkish take" data-rerender="${s.slide}"
            title="Render this slide again, ignoring what is cached"
            >Re-render</button>
        </div>
        <div class="shots">
          <div class="shot"><span>Slide ${s.slide} &mdash; before</span>
            ${shotHTML(s.before, s.slide, "before", mine, false)}</div>
          <div class="shot ${rebuilt ? "stale" : ""}"><span>Slide ${s.slide} &mdash; after</span>
            ${shotHTML(s.after, s.slide, "after", mine, true)}</div>
        </div>
        ${slideChangesHTML(s.slide, rowsForSlide(s.slide))}
      </div>`;
    }).join("")}
  </section>`;
}

/* Everything that changed something, in one order, numbered from 1.
 *
 * One list feeding both the boxes and the detail lines is what lets a number
 * on a slide mean something: 7 on the render is line 7 below. Numbering them
 * separately, which is what per-slide indices did, gave two shapes on two
 * slides the same 1 and pointed neither at anything.
 *
 * Both rounds count. The second round corrected what the first round caused,
 * on the same file the after image renders, so a designer looking for what
 * moved has no reason to care which round moved it. */
function changeRows() {
  const r = state.applied;
  if (!r) return [];
  const rows = [
    ...(r.applied || []).map((o) => ({ ...o, round: 1 })),
    ...((r.recheck && r.recheck.second_round) || [])
      .filter((o) => o.applied).map((o) => ({ ...o, round: 2 })),
  ];
  // Numbered WITHIN each slide, so slide 3 shows 1, 2, 3.
  //
  // One sequence across the whole run was the first attempt and it was a bad
  // one. It is what made a three-change slide read "3, 11, 274": the numbers
  // were positions in a 300-change deck, which is a fact about the run and
  // not about the slide anyone is looking at. It bought the ability to jump
  // from a box to one global list, and the per-slide lists that now sit under
  // each pair of renders made that pointless.
  //
  // Deck-level changes have no slide and no box, so they get no number.
  //
  // A number is only spent on a change that can be POINTED AT. Deck-level
  // changes have no slide; and a shape parked in the grey area beside the
  // canvas -- which a working deck is full of -- has a box at left -0.24 or
  // 1.25, so there is nowhere on the render to draw it. Numbering those too
  // was the rest of what looked wrong: the list counted them and the slide
  // could not show them, so the visible numbers came out full of holes and
  // the undrawable boxes piled up in the page margin.
  const seen = new Map();
  return rows.map((row) => {
    if (!row.slide || !onCanvas(row.box_before) && !onCanvas(row.box_after)) {
      return { ...row, n: null };
    }
    const next = (seen.get(row.slide) || 0) + 1;
    seen.set(row.slide, next);
    return { ...row, n: next };
  });
}

/* A box trimmed to the part of it that is on the slide, or null if none is.
 *
 * Clipping the frame alone left the box's number badge outside the picture
 * with the rest of the overhang, so a shape half off the edge got a box with
 * no number on it. Trimming instead means the box hugs exactly the part a
 * reader can see, and the badge sits on it. `overflow: hidden` stays on the
 * frame as a guarantee rather than a mechanism. */
function clampToCanvas(box) {
  if (!onCanvas(box)) return null;
  const [x, y, w, h] = box;
  const left = Math.max(0, x);
  const top = Math.max(0, y);
  return [left, top, Math.min(1, x + w) - left, Math.min(1, y + h) - top];
}

/* The handle a box and its two list rows agree on.
 *
 * The number alone stopped being unique the moment numbering became per
 * slide: every slide has a 1, so `getElementById("chg-slide-1")` answered
 * with whichever slide came first and a box on slide 4 jumped to slide 3.
 * Two namespaces because the same change is listed twice -- once under its
 * slide, once in the full list -- and an id may only appear once. */
function markKey(row) {
  return `${row.slide}-${row.n}`;
}

/* Whether a box overlaps the slide at all.
 *
 * Fractions of the slide, so the canvas is 0..1 on both axes. A shape parked
 * beside the slide measures negative, one hanging off the right measures past
 * 1, and neither has anything to point at on the render. Overlapping counts
 * as on: a shape half off the edge is half visible, and clipping draws the
 * half that is. */
function onCanvas(box) {
  if (!box) return false;
  const [x, y, w, h] = box;
  return x + w > 0 && y + h > 0 && x < 1 && y < 1;
}

/* Every change on one slide, drawable or not, in list order. */
function rowsForSlide(slide) {
  return changeRows().filter((row) => row.slide === slide);
}

/* Those of them that can be drawn, grouped by the slide they are on. */
function changeMarks() {
  const marks = new Map();
  for (const row of changeRows()) {
    // A row with no number has nothing drawable, by construction.
    if (!row.slide || row.n === null) continue;
    if (!marks.has(row.slide)) marks.set(row.slide, []);
    marks.get(row.slide).push(row);
  }
  return marks;
}

/* What changed on this slide, under the two pictures of it.
 *
 * The same numbers the boxes carry. A number on a render is only useful if
 * what it stands for is within reading distance, and it was not: it was in
 * one folded list below every slide in the run, so checking box 7 meant
 * opening the list, finding line 7 and scrolling back. Here it is beside the
 * thing it describes, which is where a designer is already looking.
 *
 * The full list stays where it is. It holds the deck-level changes, which
 * belong to no slide, and everything that was skipped, which has no box. */
/* Open when short, folded when long, and whatever the reader last chose.
 *
 * Both defaults are wrong on their own. A three-change slide wants its list
 * open, because the numbers on the render only mean anything if what they
 * stand for is within reading distance -- that is the whole point of these
 * lists sitting under the pair. A slide with two hundred and eighty changes,
 * which a real deck produces, wants it folded, because otherwise one slide's
 * list buries the next slide's renders and the preview cannot be scrolled
 * through at all.
 *
 * An explicit toggle always wins and is remembered per slide, so re-rendering
 * -- which every tick of the apply bar does -- does not fold a list the reader
 * just opened. */
/* Every fold starts closed, and the only thing that opens one is somebody
 * opening it. There used to be a threshold here -- a short list opened itself,
 * a long one did not -- and what that produces is a page whose shape depends
 * on how bad the deck is: the same section is open on one run and shut on the
 * next, so there is nowhere on the screen a designer can learn to look. The
 * pictures are the exception and are not folded at all; they are the evidence,
 * and evidence behind a disclosure triangle is evidence nobody sees.
 */
function slideListOpen(slide, _count) {
  return state.slideOpen[slide] === true;
}

function slideChangesHTML(slide, marks) {
  const held = ((state.applied && state.applied.undone) || [])
    .filter((u) => u.slide === slide);
  const heldLine = held.length
    ? `<p class="slide-changes held">${held.length}
       change${held.length === 1 ? "" : "s"} on this slide
       ${held.length === 1 ? "was" : "were"} undone, so the after render shows
       the slide without ${held.length === 1 ? "it" : "them"}.</p>`
    : "";
  if (!marks.length) {
    return `${heldLine}<p class="slide-changes empty">Nothing on this slide
      changed. It is shown for context.</p>`;
  }
  const off = marks.filter((m) => m.n === null).length;
  return `<details class="slide-fold" data-slide="${slide}"
    ${slideListOpen(slide, marks.length) ? "open" : ""}>
    <summary>${marks.length} change${marks.length === 1 ? "" : "s"} on this
      slide${off ? ` <span class="off-count">&middot; ${off} not on the
      canvas</span>` : ""}</summary>
  <div class="clusters">${clustered(marks, slideChangeRow, {
    prefix: `slide${slide}`, open: false,
  })}</div></details>${heldLine}`;
}

/* One change, as it reads under the slide it happened on. */
function slideChangeRow(m) {
  return `<li class="${m.n === null ? "offcanvas" : ""}"
    ${m.n === null ? "" : `id="chgs-${markKey(m)}"`}>
    ${m.n === null
      ? `<span class="num off" title="This shape sits outside the slide
           canvas, so there is nothing on the render to mark">off</span>`
      : `<span class="num">${m.n}</span>`}
    ${m.shape ? `<b>${esc(m.shape)}</b> &mdash; ` : ""}${esc(m.detail)}
    ${m.round === 2 ? `<span class="meta">(second pass)</span>` : ""}
    ${invisibleMark(m)}
    ${undoButton(m.id)}
  </li>`;
}

/* One box per rectangle, carrying every change that landed on it.
 *
 * Three fixes to the same shape used to draw three identical boxes stacked
 * exactly on each other, so two of the three numbers were hidden underneath
 * the third. That is what "numbers for boxes that aren't visible" was: they
 * were drawn, on top of one another, which is the same as not being drawn.
 *
 * The rectangle is rounded before it is compared. Two fixes to one shape can
 * leave it a hair apart -- a recolour does not move it, a nudge does -- and
 * boxes half a pixel apart are the same box to a reader. */
function mergedMarks(marks, isAfter) {
  const groups = new Map();
  for (const m of marks) {
    const box = clampToCanvas(
      (isAfter ? m.box_after : m.box_before) || m.box_before
    );
    if (!box) continue;
    const key = box.map((v) => v.toFixed(3)).join(",");
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(m);
  }
  return [...groups.values()].map((group) => ({
    ...group[0],
    // The trimmed rectangle, so the drawing and the grouping agree.
    box: clampToCanvas(
      (isAfter ? group[0].box_after : group[0].box_before) || group[0].box_before
    ),
    // Every number on the box, so the label matches the lines below it.
    label: group.map((m) => m.n).join(" "),
    n: group[0].n,
    title: group
      .map((m) => `${m.n}. ${m.shape ? m.shape + " - " : ""}${m.detail}`)
      .join("; "),
  }));
}


function shotHTML(src, slide, which, marks, isAfter) {
  if (!src) return "<i>not rendered</i>";
  // No lazy loading, and the frame reserves the slide's shape up front.
  //
  // This is what threw boxes into the blank margin of the page. A lazily
  // loaded image below the fold has no size until it arrives, so its frame
  // collapsed to nothing and the boxes -- positioned in percentages of that
  // nothing -- scattered into a small cluster wherever the collapsed frame
  // happened to sit. The aspect ratio comes off the rendered PNG itself
  // rather than being assumed 16:9, because a 4:3 deck would be wrong.
  const ratio = (state.preview && state.preview.aspect) || (16 / 9);
  const img = `<img src="${esc(src)}" alt="slide ${slide} ${which}"
    style="aspect-ratio:${ratio}">`;
  if (!state.highlight || !marks.length) return img;
  const boxes = mergedMarks(marks, isAfter).map((m) => {
    // On the after image a shape that was removed has no box, so the one it
    // used to occupy is drawn instead, dashed: the change is the gap, and a
    // gap is the one edit with nothing left to point at.
    const gone = isAfter && !m.box_after;
    const [x, y, w, h] = m.box;
    // The number and nothing else. Shape names on the boxes read as a wall of
    // text over the very slide they are describing, and on a table of pills
    // they covered it completely; the name belongs on the line the number
    // points at, where there is room for it.
    return `<span class="hl ${gone ? "gone" : ""} ${y < 0.06 ? "high" : ""}"
      style="left:${(x * 100).toFixed(3)}%;top:${(y * 100).toFixed(3)}%;
             width:${(w * 100).toFixed(3)}%;height:${(h * 100).toFixed(3)}%"
      title="${esc(m.title)}"><b
      data-jump="${markKey(m)}" role="button" tabindex="0">${esc(m.label)}</b></span>`;
  }).join("");
  return `<span class="frame">${img}${boxes}</span>`;
}

async function applyTicked() {
  if (state.busy || !state.session) return;
  state.busy = true;
  const button = $("#apply");
  if (button) { button.disabled = true; button.textContent = "Applying..."; }
  try {
    const res = await fetch("/api/apply", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        session: state.session,
        fix: [...state.ticked],
        rebuild: !!($("#rebuild") && $("#rebuild").checked),
      }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "the apply failed");
    state.applied = data;
    state.heldSlides = [];   // a fresh run; nothing is held back on it
    state.preview = null;   // the deck changed; any earlier shots are stale
    render();
  } catch (err) {
    setStatus(`<b>Could not apply.</b> ${esc(err.message)}`, "bad");
  } finally {
    state.busy = false;
  }
}

/* Take one change back, or put one back on.
 *
 * One id at a time, because that is how a designer reads a list of changes:
 * this one, not that one. They accumulate on the server, so taking back a
 * second change keeps the first one taken back.
 *
 * The renders are dropped, not kept: the file has just been written again, so
 * every "after" shot on the page is of a deck that no longer exists. Leaving
 * them up would be showing a change that has been undone as though it were
 * still there, which is the one thing this feature must not do. */
async function undoChange(id, restore = false, button = null) {
  // Each of these used to be a silent return, and a silent return is the one
  // outcome a button must never have: the designer presses it, nothing moves,
  // and there is nothing on the page to say why.
  if (!state.session || !id) {
    return note(button, "this change carries no id, so there is nothing to "
      + "address the undo to. Re-run the check.");
  }
  if (state.busy) {
    return note(button, "something else is still running; try again in a moment");
  }
  // Where this change was, before the run that is about to happen forgets it.
  // After the undo it is on neither list: not in the changes, because it was
  // not made, and not necessarily nameable from the report either.
  const change = changeOf(id);
  const slide = (change && change.slide) || heldSlideOf(id);
  // Only re-render if renders are on screen. Rendering drives PowerPoint and
  // costs seconds; starting one because a designer pressed Undo on a page
  // that is showing no pictures would be spending that for nothing.
  const refresh = !!state.preview;
  state.busy = true;
  for (const button of document.querySelectorAll(
    `[data-undo="${CSS.escape(id)}"], [data-redo="${CSS.escape(id)}"]`
  )) {
    button.disabled = true;
    button.textContent = restore ? "Restoring..." : "Undoing...";
  }
  // An undo is a whole run of the fixes on the original deck -- see
  // `apply_fixes(undone=...)` -- so on a large deck it takes as long as the
  // apply did. The same ticking counter the check uses, because a number
  // going up is the difference between waiting and wondering.
  const stopTicking = startTicking(
    restore ? "Putting the change back" : "Writing the deck again without it"
  );
  try {
    const res = await fetch("/api/undo", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        session: state.session,
        undo: restore ? [] : [id],
        redo: restore ? [id] : [],
      }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "the undo failed");
    stopTicking();
    if (restore) {
      delete state.undoneDetails[id];
    } else if (change) {
      // Kept because the next payload cannot carry it: on the run that holds
      // this back, the change is not made and so has no outcome to describe.
      state.undoneDetails[id] = {
        slide: change.slide, shape: change.shape, rule_id: change.rule_id,
        detail: change.detail, round: change.round,
      };
    }
    state.applied = data;
    if (slide && !state.heldSlides.includes(slide)) state.heldSlides.push(slide);
    // The shots on screen are of a file that has just been written again, so
    // they are stale whether or not they are replaced. Dropping them is what
    // makes the re-render below honest rather than a redraw of old pictures.
    state.preview = null;
    render();
    setStatus(undidLine(change, id, restore));
  } catch (err) {
    stopTicking();
    // A page served by a server started before undo existed gets "no route
    // for /api/undo", which is true and unhelpful. Say what to do about it.
    const message = /no route/i.test(err.message)
      ? `this page is talking to a server started before Undo existed. Restart
         it: python -m formatting_tool ui --reload`
      : err.message;
    setStatus(`<b>Could not undo.</b> ${esc(message)}`, "bad");
    note(button, message);
    state.busy = false;
    return;
  }
  state.busy = false;
  // Straight back to the pictures, on the slide the change was on. A designer
  // undoing something is asking what the slide looks like without it, and
  // making them press Render again to find out is making them ask twice.
  if (refresh) {
    const stopRendering = startTicking(
      `Re-rendering ${slide ? `slide ${slide}` : "the deck"}`
    );
    const ok = await loadPreview();
    stopRendering();
    // Back to naming the change, not the rendering: the rendering is over and
    // the thing the designer wants to see said is which edit went. Unless the
    // render failed, in which case its message is the one to leave up -- the
    // undo itself landed, and saying so over the failure would hide it.
    if (ok) setStatus(undidLine(change, id, restore));
  }
}

/* Say why a button did nothing, where the button is.
 *
 * The status line lives at the top of the page and the changes are hundreds
 * of pixels below it, so a failure reported only up there is a failure the
 * designer never sees: from where they are standing the button simply did
 * nothing. */
function note(button, message) {
  if (!button) return;
  button.disabled = false;
  button.textContent = "Undo";
  const existing = button.parentElement.querySelector(".undo-note");
  if (existing) existing.remove();
  const said = document.createElement("span");
  said.className = "meta undo-note";
  said.textContent = ` ${message}`;
  button.insertAdjacentElement("afterend", said);
}

/* Undo is delegated from the document, not bound when a section is drawn.
 *
 * Binding it per render is what made the Undo under a slide stop working:
 * `wirePreview` redraws the preview on its own and re-binds only itself, on
 * purpose -- a full re-wire would bind a second listener to every checkbox
 * still on the page -- so the buttons inside it came back with no listener at
 * all. Delegation has no such failure: the listener is on the document, and
 * whatever draws a button, the button works. */
document.addEventListener("click", (event) => {
  const button = event.target.closest("[data-undo], [data-redo], [data-rerender]");
  if (!button) return;
  if (button.dataset.rerender) {
    rerenderSlide(button.dataset.rerender, button);
    return;
  }
  const undo = button.dataset.undo;
  undoChange(undo || button.dataset.redo, !undo, button);
});

/* The main Render button: the same call, with a counter running.
 *
 * Rendering drives PowerPoint, which is seconds on a small deck and longer on
 * a large one, and a button that says "Rendering..." and nothing else is
 * indistinguishable from a button that has stopped working -- which is exactly
 * how it was read after a run that ended in silence.
 */
async function renderPreview() {
  const wanted = new Set((state.applied?.applied || [])
    .map((a) => a.slide).filter(Boolean));
  for (const slide of state.heldSlides) wanted.add(slide);
  const count = wanted.size;
  const stopTicking = startTicking(
    `Rendering ${count || "the"} slide${count === 1 ? "" : "s"} in PowerPoint`
  );
  const ok = await loadPreview();
  stopTicking();
  if (ok) setStatus("");
}

/* Render one slide again, whatever is cached for it.
 *
 * The cache is right nearly always: the upload never changes, and a run that
 * writes the corrected deck drops the after images itself. "Nearly always" is
 * not something a designer can check from the outside, though, and the renders
 * are what they accept the result on -- so there is a way to say render this
 * one again, now, and watch it happen. */
async function rerenderSlide(slide, button) {
  if (!state.session || !slide) return;
  if (state.busy) {
    return note(button, "something else is still running; try again in a moment");
  }
  if (button) { button.disabled = true; button.textContent = "Rendering..."; }
  const stopTicking = startTicking(`Rendering slide ${slide} again`);
  const ok = await loadPreview([Number(slide)]);
  stopTicking();
  if (ok) setStatus("");
}

/* The change this id names, while it is still one.
 *
 * Read before the undo, because afterwards there is nothing to read: the run
 * that holds a change back never makes it, so it has no outcome and no detail.
 * What it did is only knowable from the run that did it. */
function changeOf(id) {
  return changeRows().find((row) => row.id === id) || null;
}

/* The slide an already held-back change was on. */
function heldSlideOf(id) {
  const held = ((state.applied && state.applied.undone) || [])
    .find((u) => u.id === id);
  if (held && held.slide) return held.slide;
  const remembered = state.undoneDetails[id];
  return (remembered && remembered.slide) || null;
}

/* One line naming the change that was just taken back or put back.
 *
 * "Undone" on its own is the message a designer cannot act on: with forty
 * changes on the page and several of them on one slide, which one went is the
 * whole question. */
function undidLine(change, id, restore) {
  const was = change || state.undoneDetails[id];
  const where = was && was.slide ? `slide ${was.slide}` : "the deck";
  const shape = was && was.shape ? ` &middot; ${esc(was.shape)}` : "";
  const what = was && was.detail ? ` &mdash; ${esc(was.detail)}` : "";
  // The sentence that stops a correct undo from looking like a broken one: a
  // change of this kind cannot show on a render, so the designer is about to
  // compare two identical pictures and conclude the undo failed.
  const known = INVISIBLE[(was && was.rule_id) || ""];
  const invisible = known
    ? ` <span class="meta">${esc(known[1])} The deck has been written again
        either way.</span>`
    : "";
  return `<b>${restore ? "Restored" : "Undone"}.</b> ${where}${shape}${what}${invisible}`;
}

// How long the page waits for a render before it stops believing in it. The
// server gives PowerPoint five minutes; this is that plus a little, so the
// message a designer sees is the server's ("PowerPoint did not answer") rather
// than this one, whenever the server is alive to send it.
const RENDER_WAIT_MS = 330000;

async function loadPreview(force = []) {
  if (state.busy || !state.session) return false;
  state.busy = true;
  const button = $("#do-preview");
  if (button) { button.disabled = true; button.textContent = "Rendering..."; }
  const abort = new AbortController();
  const giveUp = setTimeout(() => abort.abort(), RENDER_WAIT_MS);
  try {
    // The slides something changed on, plus the ones an undo emptied. Both,
    // because a slide that has just been put back is the one a designer is
    // checking, and asking only for slides with changes on them would leave
    // exactly that slide unrendered.
    const slides = [...new Set([
      ...(state.applied?.applied || []).map((a) => a.slide),
      ...state.heldSlides,
    ].filter(Boolean))];
    const res = await fetch("/api/preview", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      // `force` names slides to render again whatever is cached for them, and
      // they have to be in `slides` too or the answer will not include them.
      body: JSON.stringify({
        session: state.session,
        slides: [...new Set([...slides, ...force])],
        force,
      }),
      signal: abort.signal,
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "the render failed");
    state.preview = data;
    render();
    return true;
  } catch (err) {
    // Three failures read the same from here -- the server died, the request
    // was abandoned, PowerPoint wedged -- and only the first needs saying,
    // because it is the one where the answer is "start it again".
    const message = err.name === "AbortError"
      ? `no answer in ${Math.round(RENDER_WAIT_MS / 1000)}s. PowerPoint may be
         showing a dialog, or the server may have stopped`
      : /fetch|network|load failed/i.test(err.message)
        ? "the server did not answer. Is it still running in the terminal?"
        : err.message;
    setStatus(`<b>Could not render.</b> ${esc(message)}`, "bad");
    // The button that started this is still on the page -- nothing re-rendered
    // -- so it has to be put back by hand. A control left saying "Rendering..."
    // forever is the failure this page keeps having: the error goes to the
    // status line at the top and the designer, reading the changes hundreds of
    // pixels below, sees only a button that stopped working.
    restoreRenderButtons(message);
    return false;
  } finally {
    clearTimeout(giveUp);
    state.busy = false;
  }
}

/* Put every control that starts a render back the way it was. */
function restoreRenderButtons(message) {
  const main = $("#do-preview");
  if (main) {
    main.disabled = false;
    main.textContent = "Render before / after";
    if (message) note(main, message);
  }
  for (const button of document.querySelectorAll("[data-rerender]")) {
    button.disabled = false;
    button.textContent = "Re-render";
  }
}

function emptyHTML(total) {
  return `<div class="empty">${total
    ? "Nothing matches the current filter."
    : "No inconsistencies found. The deck matches its master and the guidelines supplied."}</div>`;
}

function aiDebugHTML(report) {
  const ex = report.ai_exchanges || [];
  if (!ex.length) return "";
  const total = ex.reduce((n, e) => n + ((e.response?.issues || []).length), 0);
  return `<details class="runlog aidebug">
    <summary>AI exchange (${ex.length} batch${ex.length === 1 ? "" : "es"},
      ${total} finding${total === 1 ? "" : "s"} returned)</summary>
    ${ex.map((e) => `
      <div class="batch">
        <div class="batch-head">
          Batch ${esc(e.batch?.index)} of ${esc(e.batch?.of)}
          &middot; slides ${esc((e.slides || []).join(", "))}
          &middot; ${e.rule_findings_sent} rule finding(s) sent
          &middot; ${(e.images_attached || []).length
            ? `${e.images_attached.length} slide image(s) attached`
            : "no images"}
          &middot; finished ${esc(e.finish_reason || "?")}
        </div>
        <pre>${esc(JSON.stringify(e.response, null, 2))}</pre>
      </div>`).join("")}
  </details>`;
}

function logHTML(logs) {
  if (!logs.length) return "";
  const body = logs.map((l) => `${l.level.padEnd(7)} ${l.message}`).join("\n");
  return `<details class="runlog">
    <summary>Run log (${logs.length} lines)</summary>
    <pre>${esc(body)}</pre>
  </details>`;
}

/* ---------------- results interaction ---------------- */

function wireResults() {
  for (const chip of document.querySelectorAll(".chip")) {
    chip.addEventListener("click", () => {
      const sev = chip.dataset.sev;
      state.hidden.has(sev) ? state.hidden.delete(sev) : state.hidden.add(sev);
      render();
    });
  }

  const q = $("#q");
  if (q) {
    q.addEventListener("input", debounce(() => {
      const caret = q.selectionStart;
      state.query = q.value;
      render();
      // Re-rendering replaces the input, so put the caret back where it was.
      const next = $("#q");
      next.focus();
