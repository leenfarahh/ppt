<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deck check</title>
<style>
:root {
  --bg: #FAFAF9;
  --surface: #FFFFFF;
  --ink: #17191C;
  --muted: #6E7278;
  --faint: #9A9EA4;
  --line: #E5E5E1;
  --line-strong: #D3D3CE;
  --accent: #1F2A44;
  --accent-ink: #FFFFFF;
  --tint: #F0F1F4;
  --blocker: #A11B2B;
  --error: #B4531A;
  --warning: #8A6A12;
  --info: #5A6472;
  /* The change highlight. Deliberately not a brand or a severity colour: it
     is drawn on top of a client's slide and has to read as the tool's mark
     rather than as part of the design. */
  --hl: #00A3B4;
  --mono: ui-monospace, "Cascadia Mono", "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0F1114;
    --surface: #16191D;
    --ink: #E9EAEC;
    --muted: #979DA5;
    --faint: #6C737C;
    --line: #24282E;
    --line-strong: #333941;
    --accent: #E9EAEC;
    --accent-ink: #0F1114;
    --tint: #1D2127;
    --blocker: #F1707C;
    --error: #F0975A;
    --warning: #DCB53F;
    --info: #93A0B1;
    --hl: #22C7D8;
  }
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 400 14px/1.55 ui-sans-serif, -apple-system, "Segoe UI", Inter, system-ui, sans-serif;
  font-feature-settings: "cv05", "ss01";
}
main { max-width: 880px; margin: 0 auto; padding: 56px 24px 120px; }
h1, h2, h3 { margin: 0; font-weight: 600; letter-spacing: -0.011em; }
code { font-family: var(--mono); font-size: 12px; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

/* ---------- header ---------- */
header { margin-bottom: 34px; }
header h1 { font-size: 19px; }
header p { margin: 5px 0 0; color: var(--muted); font-size: 13px; }

/* ---------- drop zones ---------- */
.inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 620px) { .inputs { grid-template-columns: 1fr; } }

.drop {
  position: relative;
  background: var(--surface);
  border: 1px dashed var(--line-strong);
  border-radius: 10px;
  padding: 18px;
  min-height: 116px;
  display: flex; flex-direction: column; gap: 4px;
  transition: border-color .12s ease, background .12s ease;
}
.drop:hover { border-color: var(--faint); }
.drop.over { border-color: var(--accent); border-style: solid; background: var(--tint); }
/* The tall drop target earns its space while empty; once a file is in it the
   grid keeps both columns level anyway. */
.drop.filled { border-style: solid; border-color: var(--line-strong); min-height: 0; }
.drop-label {
  font-size: 11px; letter-spacing: .07em; text-transform: uppercase;
  color: var(--faint); font-weight: 600;
}
.drop-hint { color: var(--muted); font-size: 13px; }
.drop-hint u { text-decoration-color: var(--line-strong); text-underline-offset: 2px; cursor: pointer; }
.files { list-style: none; margin: 6px 0 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.files li { display: flex; align-items: baseline; gap: 8px; font-size: 13px; }
.files .size { color: var(--faint); font-size: 11px; font-family: var(--mono); margin-left: auto; }
.files .x {
  border: 0; background: none; color: var(--faint); padding: 0 2px;
  font-size: 15px; line-height: 1;
}
.files .x:hover { color: var(--blocker); }
.drop input[type=file] { display: none; }

/* ---------- controls ---------- */
.controls {
  display: flex; align-items: flex-end; gap: 18px; flex-wrap: wrap;
  margin-top: 18px;
}
.field { display: flex; flex-direction: column; gap: 6px; }
.field > span {
  font-size: 11px; letter-spacing: .07em; text-transform: uppercase;
  color: var(--faint); font-weight: 600;
}
select, input[type=text], input[type=number] {
  font: inherit; color: inherit; background: var(--surface);
  border: 1px solid var(--line-strong); border-radius: 7px;
  padding: 7px 10px; min-width: 190px;
}
input[type=number] { min-width: 84px; }

.segmented { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 7px; overflow: hidden; }
.segmented button {
  border: 0; background: var(--surface); padding: 7px 13px; font-size: 13px;
  color: var(--muted);
}
.segmented button + button { border-left: 1px solid var(--line-strong); }
.segmented button.on { background: var(--accent); color: var(--accent-ink); font-weight: 500; }

.run {
  margin-left: auto; border: 0; border-radius: 7px;
  background: var(--accent); color: var(--accent-ink);
  padding: 9px 20px; font-weight: 500;
}
.run:disabled { opacity: .45; cursor: default; }

details.advanced { margin-top: 16px; }
details.advanced summary {
  cursor: pointer; color: var(--muted); font-size: 12.5px;
  list-style: none; width: fit-content;
}
details.advanced summary::-webkit-details-marker { display: none; }
details.advanced summary::before { content: "+ "; color: var(--faint); }
details.advanced[open] summary::before { content: "\2212  "; }
.advanced-body {
  display: flex; gap: 16px; flex-wrap: wrap; margin-top: 14px;
  padding: 16px; background: var(--surface);
  border: 1px solid var(--line); border-radius: 9px;
}
.note { font-size: 12px; color: var(--faint); flex-basis: 100%; margin: 0; }

/* ---------- status ---------- */
.status { margin-top: 22px; font-size: 13px; color: var(--muted); }
.status.err { color: var(--blocker); }
.spinner {
  display: inline-block; width: 11px; height: 11px; margin-right: 8px;
  border: 1.5px solid var(--line-strong); border-top-color: var(--accent);
  border-radius: 50%; animation: spin .7s linear infinite; vertical-align: -1px;
}
@keyframes spin { to { transform: rotate(360deg); } }
/* Tabular figures so the line does not jog sideways at 10s and 100s. */
.status .elapsed { font-variant-numeric: tabular-nums; }

/* ---------- summary ---------- */
.summary {
  margin-top: 34px; padding-top: 18px;
  border-top: 1px solid var(--line-strong);
}
.summary-line { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.summary-line .count { font-size: 19px; font-weight: 600; letter-spacing: -0.02em; }
.summary-line .meta { color: var(--muted); font-size: 12.5px; }
.summary-line .meta code { color: var(--muted); }

.toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid var(--line-strong); background: var(--surface);
  border-radius: 20px; padding: 4px 11px; font-size: 12.5px; color: var(--muted);
}
.chip .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.chip.on { color: var(--ink); border-color: var(--faint); }
.chip.off { opacity: .42; }
.chip .n { font-family: var(--mono); font-size: 11px; }
.chip.blocker .dot { color: var(--blocker); }
.chip.error   .dot { color: var(--error); }
.chip.warning .dot { color: var(--warning); }
.chip.info    .dot { color: var(--info); }
.toolbar .grow { margin-left: auto; display: flex; gap: 8px; }
.toolbar input[type=text] { min-width: 160px; padding: 5px 10px; font-size: 13px; border-radius: 20px; }
.linkish {
  border: 1px solid var(--line-strong); background: var(--surface);
  border-radius: 20px; padding: 5px 12px; font-size: 12.5px; color: var(--muted);
}
.linkish:hover { color: var(--ink); border-color: var(--faint); }

/* ---------- notices ---------- */
.notice {
  margin-top: 16px; padding: 11px 14px; border-radius: 8px;
  border: 1px solid var(--line-strong); background: var(--surface);
  font-size: 13px; display: flex; gap: 10px; align-items: flex-start;
}
.notice b { font-weight: 600; }
.notice.warn { border-left: 3px solid var(--warning); }
.notice.bad  { border-left: 3px solid var(--blocker); }
.notice p { margin: 3px 0 0; color: var(--muted); font-size: 12.5px; }
.notes-list { margin: 9px 0 0; padding: 0; list-style: none; font-size: 12px; }
.notes-list li {
  display: flex; gap: 9px; align-items: baseline; flex-wrap: wrap;
  padding: 4px 0; border-top: 1px solid var(--line);
}
.notes-list .slide {
  font-family: var(--mono); font-size: 11px; color: var(--faint); flex: none;
}
/* The note verbatim, which is the part a designer is actually reading. */
.notes-list q { color: var(--ink); flex: 1 1 260px; }
.notes-list .where { font-size: 11px; color: var(--muted); flex: none; }
.notes-list li.kept .where { color: var(--blocker); font-weight: 600; }

/* ---------- findings ---------- */
.deck-group { margin-top: 30px; }
.deck-group > h2 {
  font-size: 13px; letter-spacing: .04em; text-transform: uppercase;
  color: var(--faint);
  padding-bottom: 8px; border-bottom: 1px solid var(--line);
}
.slide-head {
  margin-top: 22px; margin-bottom: 2px;
  font-size: 12px; font-family: var(--mono); color: var(--faint);
}

.finding {
  display: grid; grid-template-columns: 22px 82px 1fr; gap: 14px;
  padding: 11px 0; border-bottom: 1px solid var(--line);
}
/* The tick column is always there, filled or not, so the severity labels stay
   in one line down the page whether or not a finding can be applied. */
.tick { display: flex; align-items: flex-start; padding-top: 2px; }
.tick input { width: 15px; height: 15px; cursor: pointer; accent-color: var(--ink, #1f2a44); }
.tick.empty { display: block; }
.finding.fixable .msg { text-decoration: none; }

/* ---------- apply ---------- */
.applybar {
  margin: 22px 0 4px; padding: 14px 16px;
  border: 1px solid var(--line); border-radius: 8px; background: var(--card, #fbfbfa);
}
.applybar-line { font-size: 13px; }
.applybar-actions {
  display: flex; align-items: center; gap: 14px; margin-top: 10px; flex-wrap: wrap;
}
.applybar-actions .grow { flex: 1; }
.applybar .reb { font-size: 12px; color: var(--faint); display: flex; align-items: center; gap: 6px; }
.applybar button#apply {
  padding: 7px 16px; border-radius: 6px; border: 1px solid transparent;
  background: #1f2a44; color: #fff; font-size: 13px; cursor: pointer;
}
.applybar button#apply:disabled { opacity: .4; cursor: default; }

.applied { margin: 18px 0; padding: 14px 16px; border: 1px solid var(--line); border-radius: 8px; }
.applied-head { display: flex; align-items: center; gap: 10px; font-size: 13px; flex-wrap: wrap; }
.applied-head .grow { flex: 1; }
.applied-list { margin: 10px 0 0; padding-left: 18px; font-size: 12px; line-height: 1.7; }
.applied-list .dim { color: var(--faint); }
/* Numbered rows carry their own marker, so the list's own one would double it. */
.applied-list .numbered { list-style: none; margin-left: -18px; }
.applied-list .num {
  display: inline-block; min-width: 15px; text-align: center;
  background: var(--hl); color: #fff;
  font: 600 9px/1.6 var(--mono); border-radius: 3px;
  padding: 0 3px; margin-right: 7px; vertical-align: 1px;
}
.applied-list code { color: var(--faint); margin-left: 6px; }
/* Long enough to find the row after the page has scrolled to it. */
@keyframes found { from { background: var(--tint); } to { background: transparent; } }
.applied-list li.found { animation: found 1.6s ease-out; }
.applied a.dl { font-size: 12px; }

.preview { margin: 18px 0; }
.shots { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 12px; }
.shot span { display: block; font-size: 11px; font-family: var(--mono); color: var(--faint); margin-bottom: 5px; }
.shot img { width: 100%; border: 1px solid var(--line); border-radius: 4px; display: block; }
@media (max-width: 860px) { .shots { grid-template-columns: 1fr; } }

/* One slide: its two renders and what changed on it, as a single block, so a
   long run does not interleave one slide's list with the next slide's shots. */
.slide-block { margin-top: 20px; padding-bottom: 18px; border-bottom: 1px solid var(--line); }
.slide-block:last-child { border-bottom: 0; padding-bottom: 0; }
.slide-changes { margin: 10px 0 0; padding: 0; list-style: none; font-size: 12px; }
.slide-changes li {
  display: flex; gap: 7px; align-items: baseline;
  padding: 3px 0; line-height: 1.6;
}
.slide-changes li b { font-weight: 600; white-space: nowrap; }
.slide-changes .num { flex: none; }
.slide-changes li.found { background: var(--tint); border-radius: 3px; }
.slide-changes.empty { color: var(--faint); font-size: 12px; margin: 10px 0 0; }
/* Shares the badge with the full list, and the flash that answers a click. */
.slide-changes .num {
  display: inline-block; min-width: 15px; text-align: center;
  background: var(--hl); color: #fff;
  font: 600 9px/1.6 var(--mono); border-radius: 3px;
  padding: 0 3px; vertical-align: 1px;
}
.slide-changes li.found { animation: found 1.6s ease-out; }

/* ---------- change highlights ---------- */
/* The box is positioned against the image, so the wrapper has to be exactly
   the image's size: inline-block and a block img, no line-box slack. */
.frame { position: relative; display: block; }
.hl {
  position: absolute;
  border: 2px solid var(--hl);
  border-radius: 2px;
  box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.55);
  pointer-events: none;
}
/* Above the border, so it never covers the shape it is pointing at. Small:
   it is an index into the list below, not a caption. */
.hl b {
  position: absolute; left: -2px; bottom: 100%;
  background: var(--hl); color: #fff;
  font: 600 7.5px/1.35 var(--mono);
  min-width: 11px; text-align: center;
  padding: 0 2px; border-radius: 2px 2px 0 0;
  white-space: nowrap;
  pointer-events: auto; cursor: pointer;
}
.hl b:hover { filter: brightness(1.15); }
/* Except on a shape at the very top of the slide, where there is no room
   above and the label would sit over the caption instead. */
.hl.high b { bottom: auto; top: 0; border-radius: 0 0 2px 0; }
.hl.gone { border-style: dashed; }
.shot.stale .hl { display: none; }
.hl-legend { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.hl-legend .swatch {
  width: 22px; height: 0; border-top: 2px solid var(--hl); display: inline-block;
}
.finding .sev {
  display: flex; align-items: center; gap: 6px;
  /* Grid items stretch by default, which would centre the label against the
     whole finding. It belongs beside the first line of the message. */
  align-self: start; padding-top: 3px;
  font-size: 11.5px; letter-spacing: .02em;
}
.finding .sev .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none; }
.finding.blocker .sev { color: var(--blocker); }
.finding.error   .sev { color: var(--error); }
.finding.warning .sev { color: var(--warning); }
.finding.info    .sev { color: var(--info); }

.finding .head { display: flex; align-items: baseline; gap: 12px; }
.finding .msg { flex: 1; }
.finding .tag {
  font-family: var(--mono); font-size: 11px; color: var(--faint);
  white-space: nowrap;
}
.finding .where { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
.finding .pair { margin-top: 5px; font-size: 12px; display: flex; gap: 14px; flex-wrap: wrap; }
.finding .pair .k { color: var(--faint); margin-right: 5px; }
.finding .pair code {
  background: var(--tint); border-radius: 4px; padding: 1px 5px;
}
.finding .fix { margin-top: 5px; font-size: 12.5px; color: var(--muted); }
.finding .fix::before { content: "\2192  "; color: var(--faint); }
.badge-ai {
  font-size: 10px; letter-spacing: .06em; text-transform: uppercase;
  border: 1px solid var(--line-strong); border-radius: 4px;
  padding: 0 4px; color: var(--faint);
}

.empty { margin-top: 34px; padding-top: 18px; border-top: 1px solid var(--line-strong); color: var(--muted); }
.hidden { display: none !important; }

.runlog {
  margin-top: 26px; font-size: 12px;
}
.runlog summary { cursor: pointer; color: var(--faint); list-style: none; width: fit-content; }
.runlog summary::-webkit-details-marker { display: none; }
/* Folded by default, so it needs to look like something that opens. */
.changes { margin-top: 10px; }
.changes summary::before { content: "+ "; }
.changes[open] summary::before { content: "2  "; }
.changes summary:hover { color: var(--muted); }
.aidebug .batch { margin-top: 12px; }
.aidebug .batch-head {
  font-size: 11px; font-family: var(--mono); color: var(--faint); margin-bottom: 5px;
}
.aidebug pre { max-height: 380px; overflow: auto; }
.runlog pre {
  font-family: var(--mono); font-size: 11.5px; line-height: 1.6;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 8px; padding: 12px 14px; margin: 10px 0 0;
  overflow-x: auto; white-space: pre-wrap; color: var(--muted);
}
</style>
</head>
<body>
<main>
  <header>
    <h1>Deck check</h1>
    <p>Validate a deck against its master and brand guidelines.</p>
  </header>

  <section class="inputs">
    <div class="drop" id="drop-master" data-kind="master">
      <span class="drop-label">Master</span>
      <span class="drop-hint">Drop the approved deck, or <u>browse</u></span>
      <ul class="files"></ul>
      <input type="file" accept=".pptx">
    </div>
    <div class="drop" id="drop-deck" data-kind="deck">
      <span class="drop-label">Decks to check</span>
      <span class="drop-hint">Drop one or more, or <u>browse</u></span>
      <ul class="files"></ul>
      <input type="file" accept=".pptx" multiple>
    </div>
  </section>

  <div class="controls">
    <label class="field">
      <span>Guidelines</span>
      <select id="guidelines"></select>
    </label>
    <div class="field">
      <span>Layers</span>
      <div class="segmented" id="layers">
        <button data-ai="0" class="on">Rules only</button>
        <button data-ai="1">Rules + AI</button>
      </div>
    </div>
    <button class="run" id="run">Run check</button>
  </div>

  <details class="advanced">
    <summary>AI options</summary>
    <div class="advanced-body">
      <label class="field">
        <span>Model</span>
        <input type="text" id="model" spellcheck="false">
      </label>
      <label class="field">
        <span>Effort</span>
        <select id="effort">
          <option>low</option><option>medium</option><option>high</option>
          <option>xhigh</option><option>max</option>
        </select>
      </label>
      <label class="field">
        <span>Min confidence</span>
        <input type="number" id="confidence" min="0" max="1" step="0.05" value="0">
      </label>
      <label class="field">
        <span>Slides per call</span>
        <input type="number" id="batch" min="1" max="50" step="1">
      </label>
      <p class="note" id="ai-note"></p>
    </div>
  </details>

  <div class="status" id="status"></div>
  <div id="results"></div>
</main>

<script>
"use strict";

const SEVERITIES = ["blocker", "error", "warning", "info"];

const state = {
  ctx: null,
  master: null,
  decks: [],
  useAI: false,
  result: null,
  hidden: new Set(),   // severities toggled off
  query: "",
  session: null,
  fixable: new Set(),  // ids the tool can correct on its own
  ticked: new Set(),   // ids the designer has chosen
  applied: null,       // the last apply result
  preview: null,       // before/after renders
  busy: false,
  // The list of what was applied is long on a real deck and is the evidence
  // for a decision already taken, so it starts folded away; the renders are
  // what a designer actually reads. Held here rather than left to <details>
  // because every tick re-renders the section and would fold it back.
  changesOpen: false,
  highlight: true,     // draw the boxes over the before/after renders
};

const $ = (sel) => document.querySelector(sel);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const kb = (n) => n < 1e6 ? `${Math.round(n / 1024)} KB` : `${(n / 1e6).toFixed(1)} MB`;

/* ---------------- boot ---------------- */

async function boot() {
  try {
    state.ctx = await (await fetch("/api/context")).json();
  } catch (err) {
    return setStatus(`Could not reach the server: ${err.message}`, "err");
  }
  const ctx = state.ctx;

  const select = $("#guidelines");
  select.innerHTML =
    `<option value="">None (master only)</option>` +
    ctx.guidelines.map((f) => `<option value="${esc(f)}">${esc(f)}</option>`).join("");
  // A guidelines file is the difference between 11 findings and 21, so pick
  // one if there is exactly one obvious candidate.
  if (ctx.guidelines.length === 1) select.value = ctx.guidelines[0];

  $("#model").value = ctx.defaults.model;
  $("#effort").value = ctx.defaults.effort;
  $("#batch").value = ctx.defaults.batch_size;

  const notes = [];
  if (ctx.defaults.cli_model !== ctx.defaults.model) {
    notes.push(`The CLI default is <code>${esc(ctx.defaults.cli_model)}</code>, which is retired and answers 404.`);
  }
  if (!ctx.api_key) notes.push("No <code>GEMINI_API_KEY</code> in the environment, so the AI layer will fail.");
  $("#ai-note").innerHTML = notes.join(" ");

}

/* ---------------- file inputs ---------------- */

function wireDrop(el) {
  const kind = el.dataset.kind;
  const input = el.querySelector("input[type=file]");

  el.addEventListener("click", (e) => {
    // The remove buttons live inside the zone, and this listener runs before
    // the document-level one that handles them.
    if (e.target === input || e.target.closest(".x")) return;
    input.click();
  });
  input.addEventListener("change", () => { accept(kind, input.files); input.value = ""; });

  el.addEventListener("dragover", (e) => { e.preventDefault(); el.classList.add("over"); });
  el.addEventListener("dragleave", (e) => {
    if (!el.contains(e.relatedTarget)) el.classList.remove("over");
  });
  el.addEventListener("drop", (e) => {
    e.preventDefault();
    el.classList.remove("over");
    accept(kind, e.dataTransfer.files);
  });
}

function accept(kind, fileList) {
  const files = [...fileList].filter((f) => f.name.toLowerCase().endsWith(".pptx"));
  const rejected = fileList.length - files.length;
  if (rejected) setStatus(`Ignored ${rejected} file(s): only .pptx can be read.`, "err");
  if (!files.length) return;

  if (kind === "master") state.master = files[0];
  else state.decks = dedupe([...state.decks, ...files]);
  renderFiles();
}

const dedupe = (files) => {
  const seen = new Set();
  return files.filter((f) => {
    const key = `${f.name}:${f.size}`;
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  });
};

function renderFiles() {
  paint($("#drop-master"), state.master ? [state.master] : [], "master");
  paint($("#drop-deck"), state.decks, "deck");
  $("#run").disabled = !(state.master && state.decks.length);
}

function paint(el, files, kind) {
  el.classList.toggle("filled", files.length > 0);
  el.querySelector(".drop-hint").classList.toggle("hidden", files.length > 0);
  el.querySelector(".files").innerHTML = files.map((f, i) => `
    <li>
      <span>${esc(f.name)}</span>
      <span class="size">${kb(f.size)}</span>
      <button class="x" data-kind="${kind}" data-i="${i}" title="Remove">&times;</button>
    </li>`).join("");
}

document.addEventListener("click", (e) => {
  const x = e.target.closest(".x");
  if (!x) return;
  e.stopPropagation();
  if (x.dataset.kind === "master") state.master = null;
  else state.decks.splice(Number(x.dataset.i), 1);
  renderFiles();
});

/* ---------------- run ---------------- */

function setStatus(html, cls = "") {
  const el = $("#status");
  el.className = `status ${cls}`;
  el.innerHTML = html;
}

/* A status line that counts up without restarting its own spinner.
 *
 * setStatus assigns innerHTML, which throws the spinner element away and
 * builds a new one, and a new element starts its animation at zero. Called
 * from a 200ms tick against a 0.7s rotation, the spinner got 103 degrees
 * round -- just past a quarter turn -- and snapped back to the top, forever.
 * It was never the animation: it was a new spinner, four times a second.
 *
 * So the line is written once and only the seconds are rewritten, through
 * textContent on a node the spinner is not inside. Returns the function that
 * stops it.
 */
function startTicking(label) {
  const started = Date.now();
  setStatus(`<span class="spinner"></span>${label}&hellip; ` +
            `<span class="elapsed">0s</span>`);
  const tick = setInterval(() => {
    const elapsed = $("#status .elapsed");
    // Gone means something else has claimed the status line -- an error, or
    // the run finishing -- and there is nothing left to count into.
    if (!elapsed) return;
    elapsed.textContent = `${((Date.now() - started) / 1000).toFixed(0)}s`;
  }, 200);
  return () => clearInterval(tick);
}

async function runCheck() {
  if (!state.master || !state.decks.length) return;

  const form = new FormData();
  form.append("master", state.master, state.master.name);
  for (const deck of state.decks) form.append("deck", deck, deck.name);
  form.append("options", JSON.stringify({
    guidelines: $("#guidelines").value,
    use_ai: state.useAI,
    model: $("#model").value,
    effort: $("#effort").value,
    min_confidence: Number($("#confidence").value) || 0,
    batch_size: Number($("#batch").value) || undefined,
  }));

  $("#run").disabled = true;
  $("#results").innerHTML = "";
  state.ticked.clear();
  state.applied = null;
  state.preview = null;

  const stopTicking = startTicking(
    `Reading ${state.decks.length} deck(s)` +
    `${state.useAI ? " and asking the model" : ""}`
  );

  try {
    const response = await fetch("/api/validate", { method: "POST", body: form });
    const data = await response.json();
    if (!response.ok) throw new Error(data.detail || data.error || `HTTP ${response.status}`);
    state.result = data;
    state.hidden.clear();
    state.query = "";
    setStatus("");
    render();
  } catch (err) {
    setStatus(`<b>Run failed.</b> ${esc(err.message)}`, "err");
  } finally {
    stopTicking();
    $("#run").disabled = false;
  }
}

/* ---------------- render ---------------- */

function render() {
  const { report, logs, elapsed_s: elapsed, ai } = state.result;
  state.session = state.result.session || state.session;
  if (state.result.fixable) state.fixable = new Set(state.result.fixable);
  const issues = report.issues || [];
  const counts = Object.fromEntries(SEVERITIES.map((s) =>
    [s, issues.filter((i) => i.severity === s).length]));

  const visible = issues.filter((i) => !state.hidden.has(i.severity) && matches(i));

  $("#results").innerHTML = [
    summaryHTML(report, issues, counts, visible, elapsed),
    noticesHTML(logs, ai, report),
    applyBarHTML(issues),
    notesHTML(),
    appliedHTML(),
    previewHTML(),
    visible.length ? groupsHTML(visible) : emptyHTML(issues.length),
    aiDebugHTML(report),
    logHTML(logs),
  ].join("");

  wireResults();
}

const matches = (issue) => {
  if (!state.query) return true;
  const q = state.query.toLowerCase();
  return [issue.message, issue.rule_id, issue.shape, issue.found, issue.expected, issue.suggestion]
    .some((v) => v && String(v).toLowerCase().includes(q));
};

function summaryHTML(report, issues, counts, visible, elapsed) {
  const filtered = visible.length !== issues.length;
  const meta = [
    `${esc(report.decks.join(", "))} vs ${esc(report.master)}`,
    report.guidelines ? esc(report.guidelines.split(/[\\/]/).pop()) : "no guidelines",
    `${elapsed}s`,
  ];
  return `
  <section class="summary">
    <div class="summary-line">
      <span class="count">${issues.length}</span>
      <span>finding${issues.length === 1 ? "" : "s"}</span>
      ${filtered ? `<span class="meta">(${visible.length} shown)</span>` : ""}
      <span class="meta">&middot; ${meta.join(" &middot; ")}</span>
    </div>
    <div class="toolbar">
      ${SEVERITIES.filter((s) => counts[s]).map((s) => `
        <button class="chip ${s} ${state.hidden.has(s) ? "off" : "on"}" data-sev="${s}">
          <span class="dot"></span>${s}<span class="n">${counts[s]}</span>
        </button>`).join("")}
      <div class="grow">
        <input type="text" id="q" placeholder="Filter…" value="${esc(state.query)}">
        <button class="linkish" id="save">Save JSON</button>
      </div>
    </div>
  </section>`;
}

function noticesHTML(logs, ai, report) {
  const out = [];

  if (ai.requested && !ai.ran) {
    const why = logs.find((l) => l.level === "error");
    out.push(`<div class="notice bad">
      <div><b>The AI layer did not run.</b>
      <p>${esc(why ? why.message : "The call failed.")}</p>
      <p>What follows is the deterministic layer alone.</p></div></div>`);
  }

  for (const l of logs.filter((l) => l.level === "warning")) {
    out.push(`<div class="notice warn"><div><b>Warning.</b><p>${esc(l.message)}</p></div></div>`);
  }

  if (report.inferred_values && report.inferred_values.length) {
    out.push(`<div class="notice warn"><div>
      <b>${report.inferred_values.length} brand value(s) were inferred, not stated.</b>
      <p>Findings resting on these are the weaker claims here:
      <code>${report.inferred_values.map(esc).join("</code>, <code>")}</code></p></div></div>`);
  }

  if (report.ai_summary) {
    out.push(`<div class="notice"><div><b>Model summary.</b><p>${esc(report.ai_summary)}</p></div></div>`);
  }
  return out.join("");
}

function groupsHTML(issues) {
  const byDeck = new Map();
  for (const issue of issues) {
    const key = issue.deck || "deck";
    if (!byDeck.has(key)) byDeck.set(key, []);
    byDeck.get(key).push(issue);
  }

  return [...byDeck].map(([deck, list]) => {
    const bySlide = new Map();
    for (const issue of list) {
      // Deck-level findings carry no slide number; -1 sorts them to the front.
      const slide = issue.slide ?? -1;
      if (!bySlide.has(slide)) bySlide.set(slide, []);
      bySlide.get(slide).push(issue);
    }
    const slides = [...bySlide].sort((a, b) => a[0] - b[0]);

    return `<section class="deck-group">
      <h2>${esc(deck)}</h2>
      ${slides.map(([slide, items]) => `
        <div class="slide-head">${slide < 0 ? "Whole deck" : `Slide ${slide}`}</div>
        ${items.map(findingHTML).join("")}`).join("")}
    </section>`;
  }).join("");
}

function findingHTML(issue) {
  const pairs = [];
  if (issue.expected) pairs.push(`<span><span class="k">expected</span><code>${esc(issue.expected)}</code></span>`);
  if (issue.found) pairs.push(`<span><span class="k">found</span><code>${esc(issue.found)}</code></span>`);

  const tags = [];
  if (issue.source === "ai") {
    tags.push(`<span class="badge-ai">AI${issue.confidence != null
      ? ` ${Math.round(issue.confidence * 100)}%` : ""}</span>`);
  }
  if (issue.rule_id) tags.push(esc(issue.rule_id));
  else tags.push(esc(issue.category));

  const canFix = state.fixable.has(issue.id);
  const box = canFix
    ? `<label class="tick" title="Apply this fix">
         <input type="checkbox" data-fix="${esc(issue.id)}"
                ${state.ticked.has(issue.id) ? "checked" : ""}></label>`
    : `<span class="tick empty" title="Needs a designer">&nbsp;</span>`;

  return `<article class="finding ${esc(issue.severity)}${canFix ? " fixable" : ""}">
    ${box}
    <div class="sev"><span class="dot"></span>${esc(issue.severity)}</div>
    <div>
      <div class="head">
        <span class="msg">${esc(issue.message)}</span>
        <span class="tag">${tags.join(" ")}</span>
      </div>
      ${issue.shape ? `<div class="where">${esc(issue.shape)}</div>` : ""}
      ${pairs.length ? `<div class="pair">${pairs.join("")}</div>` : ""}
      ${issue.suggestion ? `<div class="fix">${esc(issue.suggestion)}</div>` : ""}
    </div>
  </article>`;
}

/* ---------------- apply ---------------- */

function applyBarHTML(issues) {
  const total = state.fixable.size;
  if (!total) {
    return `<div class="notice"><div><b>Nothing here can be applied automatically.</b>
      <p>Every finding needs a designer: which of two overlapping boxes moves,
      which logo file to use, what copy to write. Those are design calls.</p></div></div>`;
  }
  const n = state.ticked.size;
  return `<section class="applybar">
    <div class="applybar-line">
      <b>${n}</b> of ${total} fixable finding${total === 1 ? "" : "s"} ticked
      <span class="meta">&middot; ${issues.length - total} need a designer</span>
    </div>
    <div class="applybar-actions">
      <button class="linkish" id="tick-all">Tick all fixable</button>
      <button class="linkish" id="tick-none">Clear</button>
      <span class="grow"></span>
      <label class="reb"><input type="checkbox" id="rebuild">
        Also rebuild onto the master's layouts</label>
      <button id="apply" ${n ? "" : "disabled"}>Apply ${n || ""}</button>
    </div>
  </section>`;
}

/* Production notes this run moved off the slides.
 *
 * Always shown, never folded, and shown whatever happened to the note. A note
 * is a message a person wrote to another person on purpose, so every one of
 * them wants a human decision: the ones that became comments are waiting in
 * PowerPoint's Comments pane, the ones on a notes page are off the slide but
 * nobody has been told about them, and the ones that could not be moved are
 * still on the slide and must not be sent. Deleting them quietly, which is
 * what this used to do, made all three invisible. */
function notesHTML() {
  const notes = (state.applied && state.applied.notes) || [];
  if (!notes.length) return "";
  const kept = notes.filter((n) => n.where === "kept");
  const label = {
    comment: "in a PowerPoint comment",
    notes: "on the slide's notes page",
    kept: "STILL ON THE SLIDE",
  };
  return `<div class="notice ${kept.length ? "bad" : "warn"} notes"><div>
    <b>${notes.length} production note${notes.length === 1 ? "" : "s"}
      moved off the slide${notes.length === 1 ? "" : "s"}.</b>
    <p>${kept.length
      ? `${kept.length} could not be moved and ${kept.length === 1
          ? "is" : "are"} still on the deck. Take ${kept.length === 1
          ? "it" : "them"} off before this goes out.`
      : "Nothing was deleted: each note was copied out before its shape came "
        + "off, so every one is still readable somewhere."}
      Re-check each of these.</p>
    <ul class="notes-list">
      ${notes.map((n) => `<li class="${esc(n.where)}">
        <span class="slide">slide ${esc(n.slide)}</span>
        <q>${esc(n.text)}</q>
        <span class="where">${label[n.where] || esc(n.where)}</span>
      </li>`).join("")}
    </ul>
  </div></div>`;
}

function appliedHTML() {
  const r = state.applied;
  if (!r) return "";
  // The same numbering the boxes on the renders carry, so a box and its line
  // are one thing addressed two ways. Numbered rows get an id to jump to.
  const rows = changeRows().map((a) => `<li id="chg-${a.n}" class="numbered">
    <span class="num">${a.n}</span>
    ${a.slide ? `slide ${a.slide}` : "deck"}${a.shape ? ` &middot; ${esc(a.shape)}` : ""}
    &mdash; ${esc(a.detail)}${a.round === 2
      ? ` <span class="meta">(second pass)</span>` : ""}
    <code>${esc(a.id)}</code></li>`).join("");
  // Not numbered: nothing was changed, so there is nothing on a render to
  // point at.
  const skipped = r.skipped.map((a) => `<li class="dim"><code>${esc(a.id)}</code>
    ${esc(a.detail)}</li>`).join("");
  const n = changeRows().length + r.skipped.length;
  return `<section class="applied">
    <div class="applied-head">
      <b>${r.applied.length} fix${r.applied.length === 1 ? "" : "es"} applied</b>
      ${r.skipped.length ? `<span class="meta">&middot; ${r.skipped.length} skipped</span>` : ""}
      ${r.rebuilt ? `<span class="meta">&middot; rebuilt onto the master</span>` : ""}
      <span class="grow"></span>
      <button class="linkish" id="do-preview">Render before / after</button>
      <a class="dl" href="${esc(r.download)}" download>Download the corrected deck</a>
    </div>
    <details class="runlog changes" ${state.changesOpen ? "open" : ""}>
      <summary>${n} change${n === 1 ? "" : "s"} in detail</summary>
      <ul class="applied-list">${rows}${skipped}</ul>
    </details>
  </section>`;
}

function previewHTML() {
  const p = state.preview;
  if (!p) return "";
  if (!p.renderer_ok) {
    return `<div class="notice warn"><div><b>No preview.</b>
      <p>Rendering needs PowerPoint and pywin32 on Windows
      (<code>pip install pywin32</code>).</p></div></div>`;
  }
  const marks = changeMarks();
  const rebuilt = !!(state.applied && state.applied.rebuilt);
  const total = [...marks.values()].reduce((n, m) => n + m.length, 0);
  return `<section class="preview">
    <div class="applied-head"><b>Before and after</b>
      <span class="meta">&middot; rendered by PowerPoint</span>
      <span class="grow"></span>
      ${total ? `<label class="hl-legend"><input type="checkbox" id="hl-toggle"
        ${state.highlight ? "checked" : ""}> <span class="swatch"></span>
        Highlight the ${total} change${total === 1 ? "" : "s"}</label>` : ""}
    </div>
    ${rebuilt && total ? `<p class="note">The deck was also rebuilt onto the
      master, which re-places every shape on the slide. The boxes mark what
      this run corrected; on the after render they show where each shape stood
      before the rebuild moved it.</p>` : ""}
    ${p.slides.map((s) => {
      const mine = marks.get(s.slide) || [];
      return `
      <div class="slide-block">
        <div class="shots">
          <div class="shot"><span>Slide ${s.slide} &mdash; before</span>
            ${shotHTML(s.before, s.slide, "before", mine, false)}</div>
          <div class="shot ${rebuilt ? "stale" : ""}"><span>Slide ${s.slide} &mdash; after</span>
            ${shotHTML(s.after, s.slide, "after", mine, true)}</div>
        </div>
        ${slideChangesHTML(mine)}
      </div>`;
    }).join("")}
  </section>`;
}

/* Everything that changed something, in one order, numbered from 1.
 *
 * One list feeding both the boxes and the detail lines is what lets a number
 * on a slide mean something: 7 on the render is line 7 below. Numbering them
 * separately, which is what per-slide indices did, gave two shapes on two
 * slides the same 1 and pointed neither at anything.
 *
 * Both rounds count. The second round corrected what the first round caused,
 * on the same file the after image renders, so a designer looking for what
 * moved has no reason to care which round moved it. */
function changeRows() {
  const r = state.applied;
  if (!r) return [];
  const rows = [
    ...(r.applied || []).map((o) => ({ ...o, round: 1 })),
    ...((r.recheck && r.recheck.second_round) || [])
      .filter((o) => o.applied).map((o) => ({ ...o, round: 2 })),
  ];
  return rows.map((row, i) => ({ ...row, n: i + 1 }));
}

/* Those of them that can be drawn, grouped by the slide they are on. */
function changeMarks() {
  const marks = new Map();
  for (const row of changeRows()) {
    if (!row.slide || (!row.box_before && !row.box_after)) continue;
    if (!marks.has(row.slide)) marks.set(row.slide, []);
    marks.get(row.slide).push(row);
  }
  return marks;
}

/* What changed on this slide, under the two pictures of it.
 *
 * The same numbers the boxes carry. A number on a render is only useful if
 * what it stands for is within reading distance, and it was not: it was in
 * one folded list below every slide in the run, so checking box 7 meant
 * opening the list, finding line 7 and scrolling back. Here it is beside the
 * thing it describes, which is where a designer is already looking.
 *
 * The full list stays where it is. It holds the deck-level changes, which
 * belong to no slide, and everything that was skipped, which has no box. */
function slideChangesHTML(marks) {
  if (!marks.length) {
    return `<p class="slide-changes empty">Nothing on this slide changed.
      It is shown for context.</p>`;
  }
  return `<ul class="slide-changes">
    ${marks.map((m) => `<li id="chg-slide-${m.n}">
      <span class="num">${m.n}</span>
      ${m.shape ? `<b>${esc(m.shape)}</b> &mdash; ` : ""}${esc(m.detail)}
      ${m.round === 2 ? `<span class="meta">(second pass)</span>` : ""}
    </li>`).join("")}
  </ul>`;
}

function shotHTML(src, slide, which, marks, isAfter) {
  if (!src) return "<i>not rendered</i>";
  const img = `<img src="${esc(src)}" loading="lazy" alt="slide ${slide} ${which}">`;
  if (!state.highlight || !marks.length) return img;
  const boxes = marks.map((m) => {
    // On the after image a shape that was removed has no box, so the one it
    // used to occupy is drawn instead, dashed: the change is the gap, and a
    // gap is the one edit with nothing left to point at.
    const box = (isAfter ? m.box_after : m.box_before) || m.box_before;
    const gone = isAfter && !m.box_after;
    if (!box) return "";
    const [x, y, w, h] = box;
    // The number and nothing else. Shape names on the boxes read as a wall of
    // text over the very slide they are describing, and on a table of pills
    // they covered it completely; the name belongs on the line the number
    // points at, where there is room for it.
    return `<span class="hl ${gone ? "gone" : ""} ${y < 0.06 ? "high" : ""}"
      style="left:${(x * 100).toFixed(3)}%;top:${(y * 100).toFixed(3)}%;
             width:${(w * 100).toFixed(3)}%;height:${(h * 100).toFixed(3)}%"
      title="${esc(m.shape ? m.shape + " — " + m.detail : m.detail)}"><b
      data-jump="${m.n}" role="button" tabindex="0">${m.n}</b></span>`;
  }).join("");
  return `<span class="frame">${img}${boxes}</span>`;
}

async function applyTicked() {
  if (state.busy || !state.session) return;
  state.busy = true;
  const button = $("#apply");
  if (button) { button.disabled = true; button.textContent = "Applying..."; }
  try {
    const res = await fetch("/api/apply", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        session: state.session,
        fix: [...state.ticked],
        rebuild: !!($("#rebuild") && $("#rebuild").checked),
      }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "the apply failed");
    state.applied = data;
    state.preview = null;   // the deck changed; any earlier shots are stale
    render();
  } catch (err) {
    setStatus(`<b>Could not apply.</b> ${esc(err.message)}`, "bad");
  } finally {
    state.busy = false;
  }
}

async function loadPreview() {
  if (state.busy || !state.session) return;
  state.busy = true;
  const button = $("#do-preview");
  if (button) { button.disabled = true; button.textContent = "Rendering..."; }
  try {
    const slides = [...new Set((state.applied?.applied || [])
      .map((a) => a.slide).filter(Boolean))];
    const res = await fetch("/api/preview", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session: state.session, slides }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "the render failed");
    state.preview = data;
    render();
  } catch (err) {
    setStatus(`<b>Could not render.</b> ${esc(err.message)}`, "bad");
  } finally {
    state.busy = false;
  }
}

function emptyHTML(total) {
  return `<div class="empty">${total
    ? "Nothing matches the current filter."
    : "No inconsistencies found. The deck matches its master and the guidelines supplied."}</div>`;
}

function aiDebugHTML(report) {
  const ex = report.ai_exchanges || [];
  if (!ex.length) return "";
  const total = ex.reduce((n, e) => n + ((e.response?.issues || []).length), 0);
  return `<details class="runlog aidebug">
    <summary>AI exchange (${ex.length} batch${ex.length === 1 ? "" : "es"},
      ${total} finding${total === 1 ? "" : "s"} returned)</summary>
    ${ex.map((e) => `
      <div class="batch">
        <div class="batch-head">
          Batch ${esc(e.batch?.index)} of ${esc(e.batch?.of)}
          &middot; slides ${esc((e.slides || []).join(", "))}
          &middot; ${e.rule_findings_sent} rule finding(s) sent
          &middot; ${(e.images_attached || []).length
            ? `${e.images_attached.length} slide image(s) attached`
            : "no images"}
          &middot; finished ${esc(e.finish_reason || "?")}
        </div>
        <pre>${esc(JSON.stringify(e.response, null, 2))}</pre>
      </div>`).join("")}
  </details>`;
}

function logHTML(logs) {
  if (!logs.length) return "";
  const body = logs.map((l) => `${l.level.padEnd(7)} ${l.message}`).join("\n");
  return `<details class="runlog">
    <summary>Run log (${logs.length} lines)</summary>
    <pre>${esc(body)}</pre>
  </details>`;
}

/* ---------------- results interaction ---------------- */

function wireResults() {
  for (const chip of document.querySelectorAll(".chip")) {
    chip.addEventListener("click", () => {
      const sev = chip.dataset.sev;
      state.hidden.has(sev) ? state.hidden.delete(sev) : state.hidden.add(sev);
      render();
    });
  }

  const q = $("#q");
  if (q) {
    q.addEventListener("input", debounce(() => {
      const caret = q.selectionStart;
      state.query = q.value;
      render();
      // Re-rendering replaces the input, so put the caret back where it was.
      const next = $("#q");
      next.focus();
      next.setSelectionRange(caret, caret);
    }, 160));
  }

  const save = $("#save");
  if (save) save.addEventListener("click", saveJSON);

  for (const box of document.querySelectorAll("input[data-fix]")) {
    box.addEventListener("change", () => {
      box.checked ? state.ticked.add(box.dataset.fix)
                  : state.ticked.delete(box.dataset.fix);
      // Only the bar's count changes, so redraw it rather than the whole list:
      // a full render would scroll the reader back to the top mid-tick.
      const bar = $(".applybar");
      if (bar) {
        bar.outerHTML = applyBarHTML(state.result.report.issues || []);
        wireApplyBar();
      }
    });
  }
  wireApplyBar();

  const preview = $("#do-preview");
  if (preview) preview.addEventListener("click", loadPreview);

  const changes = document.querySelector("details.changes");
  if (changes) changes.addEventListener("toggle", () => {
    state.changesOpen = changes.open;
  });

  wirePreview();
}

function wirePreview() {
  // Redraws the preview alone, and re-wires only itself. A full render would
  // scroll the reader back to the top, away from the very slide they were
  // comparing; re-running wireResults would bind a second listener to every
  // chip and checkbox still on the page.
  const hl = $("#hl-toggle");
  if (hl) hl.addEventListener("change", () => {
    state.highlight = hl.checked;
    const section = document.querySelector(".preview");
    if (!section) return;
    section.outerHTML = previewHTML();
    wirePreview();
  });

  for (const badge of document.querySelectorAll(".hl b[data-jump]")) {
    badge.addEventListener("click", () => jumpToChange(badge.dataset.jump));
    badge.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        jumpToChange(badge.dataset.jump);
      }
    });
  }
}

/* Show the line a box's number stands for.
 *
 * The list is folded by default, so an anchor alone would scroll to something
 * display:none and land nowhere. Opening it first is the whole trick, and the
 * flash is what stops a jump into forty near-identical lines from leaving the
 * reader hunting for which one moved. */
function jumpToChange(n) {
  // The row under the slide first: it is already on screen, so nothing has to
  // be unfolded and nothing scrolls away from the render being compared.
  let row = document.getElementById(`chg-slide-${n}`);
  if (!row) {
    const details = document.querySelector("details.changes");
    if (details && !details.open) {
      details.open = true;
      state.changesOpen = true;
    }
    row = document.getElementById(`chg-${n}`);
  }
  if (!row) return;
  row.scrollIntoView({ behavior: "smooth", block: "center" });
  row.classList.remove("found");
  // Reading offsetWidth restarts the animation; without it a second click on
  // the same number does nothing visible.
  void row.offsetWidth;
  row.classList.add("found");
}

function wireApplyBar() {
  const all = $("#tick-all");
  if (all) all.addEventListener("click", () => {
    state.ticked = new Set(state.fixable);
    render();
  });
  const none = $("#tick-none");
  if (none) none.addEventListener("click", () => {
    state.ticked.clear();
    render();
  });
  const apply = $("#apply");
  if (apply) apply.addEventListener("click", applyTicked);
}

function debounce(fn, ms) {
  let timer;
  return (...args) => { clearTimeout(timer); timer = setTimeout(() => fn(...args), ms); };
}

function saveJSON() {
  const report = state.result.report;
  const blob = new Blob([JSON.stringify(report, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `${report.decks[0].replace(/\.pptx$/i, "")}-review.json`;
  a.click();
  URL.revokeObjectURL(a.href);
}

/* ---------------- wiring ---------------- */

document.querySelectorAll(".drop").forEach(wireDrop);

$("#layers").addEventListener("click", (e) => {
  const button = e.target.closest("button");
  if (!button) return;
  state.useAI = button.dataset.ai === "1";
  for (const b of $("#layers").children) b.classList.toggle("on", b === button);
});

$("#run").addEventListener("click", runCheck);
document.addEventListener("keydown", (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key === "Enter") runCheck();
});

renderFiles();
boot();
</script>
</body>
</html>
